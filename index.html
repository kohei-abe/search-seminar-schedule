<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#132f2b">
  <title>研修日程検索｜2026年10月〜2027年3月</title>
  <meta name="description" content="会社契約の外部研修を、キーワード・カテゴリ・月・開催形式で探せる日程一覧です。">
  <style>
    :root {
      --ink: #132f2b;
      --muted: #66736f;
      --paper: #f7f5ef;
      --card: #fffefb;
      --line: #dedbd1;
      --accent: #f05a3c;
      --accent-soft: #fff0e9;
      --teal: #0d746a;
      --teal-soft: #e4f3ef;
      --yellow: #f3c951;
      --shadow: 0 20px 50px rgba(19, 47, 43, .09);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      line-height: 1.65;
    }

    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    a { color: inherit; }
    .shell { width: min(1180px, calc(100% - 32px)); margin-inline: auto; }

    .page-intro { padding: 28px 0 16px; }
    .page-intro h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); line-height: 1.25; letter-spacing: -.035em; }
    .page-intro p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }

    .filters-wrap { position: sticky; top: 0; z-index: 20; padding: 10px 0 18px; background: linear-gradient(var(--paper) 74%, transparent); }
    .filters {
      padding: 16px;
      border: 1px solid rgba(19, 47, 43, .11);
      border-radius: 20px;
      background: rgba(255, 254, 251, .94);
      box-shadow: 0 12px 30px rgba(19, 47, 43, .07);
      backdrop-filter: blur(14px);
    }
    .filter-grid { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(4, minmax(120px, 1fr)); gap: 10px; }
    .field { position: relative; }
    .field label { display: block; margin: 0 0 5px 3px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .field input, .field select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
    }
    .field input { padding-left: 39px; }
    .field .search-mark { position: absolute; left: 14px; bottom: 11px; color: var(--muted); }
    .field input:focus, .field select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(13, 116, 106, .12); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 13px; }
    .view-switch { display: inline-flex; padding: 4px; border-radius: 11px; background: #eceae3; }
    .view-button { border: 0; border-radius: 8px; padding: 7px 13px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 800; }
    .view-button.active { background: #fff; color: var(--ink); box-shadow: 0 2px 7px rgba(19, 47, 43, .1); }
    .clear-button { border: 0; background: transparent; color: var(--teal); padding: 6px; font-size: 12px; font-weight: 800; }

    .results-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 28px 0 16px; }
    .results-head h2 { margin: 0; font-size: clamp(25px, 3vw, 34px); letter-spacing: -.04em; }
    .results-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .sort-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .sort-label select { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 8px 10px; color: var(--ink); }

    .course-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; padding-bottom: 80px; }
    .course-card {
      position: relative;
      min-width: 0;
      padding: 22px;
      border: 1px solid rgba(19, 47, 43, .12);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 2px 0 rgba(19, 47, 43, .04);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .course-card:hover { transform: translateY(-2px); border-color: rgba(13, 116, 106, .3); box-shadow: var(--shadow); }
    .badges { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 13px; }
    .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 9px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); font-size: 10px; font-weight: 900; letter-spacing: .03em; }
    .badge.online { background: var(--accent-soft); color: #b83e28; }
    .course-card h3 { margin: 0; font-size: 18px; line-height: 1.45; letter-spacing: -.02em; }
    .audience { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
    .audience-label { margin-right: 2px; color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .08em; }
    .audience-item { display: inline-flex; align-items: center; min-height: 23px; padding: 2px 8px; border-radius: 999px; background: #fff5ca; color: #755709; font-size: 10px; font-weight: 900; }
    .course-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0 10px; }
    .course-meta strong { font-size: 12px; }
    .course-meta span { color: var(--muted); font-size: 11px; }
    .session-chips { display: grid; gap: 7px; }
    .session-chip { display: grid; grid-template-columns: 90px 1fr auto; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 11px; background: #f3f1ea; font-size: 12px; }
    .session-chip strong { font-variant-numeric: tabular-nums; }
    .session-chip time { font-variant-numeric: tabular-nums; color: var(--muted); }
    .part { color: #875f06; font-weight: 900; }
    .more-sessions { margin: 8px 0 0; color: var(--muted); font-size: 11px; }
    details { margin-top: 17px; border-top: 1px solid var(--line); }
    summary { padding-top: 14px; color: var(--teal); font-size: 12px; font-weight: 900; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "＋"; float: right; }
    details[open] summary::after { content: "−"; }
    .detail-body { padding: 10px 0 2px; color: #40514d; font-size: 13px; }
    .detail-copy { white-space: pre-line; }
    .all-sessions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin: 16px 0; }
    .all-session { padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 11px; font-variant-numeric: tabular-nums; }
    .detail-link { display: inline-flex; align-items: center; gap: 7px; border-radius: 10px; background: var(--ink); color: #fff; padding: 9px 12px; text-decoration: none; font-size: 12px; font-weight: 900; }
    .detail-link:hover { background: var(--teal); }

    .timeline { display: grid; gap: 12px; padding-bottom: 80px; }
    .month-heading { position: sticky; top: 138px; z-index: 5; width: fit-content; margin: 18px 0 2px; padding: 6px 13px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 900; }
    .timeline-item { display: grid; grid-template-columns: 112px minmax(0, 1fr) 120px; gap: 18px; align-items: center; padding: 15px 18px; border: 1px solid rgba(19, 47, 43, .12); border-radius: 16px; background: var(--card); }
    .date-box { display: flex; align-items: baseline; gap: 7px; font-variant-numeric: tabular-nums; }
    .date-box strong { font-family: Georgia, serif; font-size: 28px; line-height: 1; }
    .date-box span { color: var(--muted); font-size: 12px; }
    .timeline-title { min-width: 0; }
    .timeline-title a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 900; text-decoration: none; }
    .timeline-title a:hover { color: var(--teal); text-decoration: underline; }
    .timeline-title small { color: var(--muted); }
    .timeline-time { text-align: right; font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .empty { grid-column: 1 / -1; padding: 70px 24px; border: 1px dashed #c8c4b8; border-radius: var(--radius); text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 18px; }
    .hidden { display: none !important; }

    .back-top { position: fixed; right: 18px; bottom: 18px; z-index: 30; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--ink); color: #fff; box-shadow: 0 8px 24px rgba(19, 47, 43, .2); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .back-top.show { opacity: 1; pointer-events: auto; }
    footer { border-top: 1px solid var(--line); padding: 22px 0 34px; color: var(--muted); font-size: 11px; }

    @media (max-width: 900px) {
      .filter-grid { grid-template-columns: 1fr 1fr; }
      .search-field { grid-column: 1 / -1; }
      .course-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .shell { width: min(100% - 22px, 1180px); }
      .page-intro { padding-top: 22px; }
      .filter-grid { grid-template-columns: 1fr; }
      .search-field { grid-column: auto; }
      .filters-wrap { position: static; }
      .results-head { align-items: flex-start; flex-direction: column; }
      .course-card { padding: 18px; }
      .session-chip { grid-template-columns: 82px 1fr; }
      .session-chip .part { grid-column: 1 / -1; }
      .all-sessions { grid-template-columns: 1fr; }
      .month-heading { top: 8px; }
      .timeline-item { grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
      .timeline-time { grid-column: 2; text-align: left; }
    }
    @media print {
      body { background: #fff; }
      .filters-wrap, .back-top, .view-switch, .sort-label, footer { display: none !important; }
      .course-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .course-card { break-inside: avoid; box-shadow: none; padding: 14px; }
      details { display: none; }
    }
  </style>
</head>
<body>
  <header class="page-intro" id="top">
    <div class="shell">
      <h1>研修日程検索</h1>
      <p>2026年10月〜2027年3月に東京またはライブ配信で開催される研修を検索できます。</p>
    </div>
  </header>

  <main class="shell">
    <div class="filters-wrap">
      <section class="filters" aria-label="研修の絞り込み">
        <div class="filter-grid">
          <div class="field search-field">
            <label for="search">キーワード</label>
            <span class="search-mark" aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="例：タイムマネジメント、報連相" autocomplete="off">
          </div>
          <div class="field">
            <label for="category">関連テーマ</label>
            <select id="category"><option value="">すべての関連テーマ</option></select>
          </div>
          <div class="field">
            <label for="target">対象</label>
            <select id="target"><option value="">すべての対象</option></select>
          </div>
          <div class="field">
            <label for="month">開催月</label>
            <select id="month"><option value="">すべての月</option></select>
          </div>
          <div class="field">
            <label for="format">開催形式</label>
            <select id="format">
              <option value="">すべての形式</option>
              <option value="venue">会場開催</option>
              <option value="online">ライブオンライン</option>
            </select>
          </div>
        </div>
        <div class="toolbar">
          <div class="view-switch" role="group" aria-label="表示形式">
            <button class="view-button active" data-view="courses" type="button">研修別</button>
            <button class="view-button" data-view="timeline" type="button">日程順</button>
          </div>
          <button class="clear-button" id="clearFilters" type="button">条件をクリア</button>
        </div>
      </section>
    </div>

    <section aria-labelledby="resultsTitle">
      <div class="results-head">
        <div>
          <h2 id="resultsTitle">研修を探す</h2>
          <p id="resultCount" aria-live="polite"></p>
        </div>
        <label class="sort-label" id="sortWrap">並び順
          <select id="sort">
            <option value="date">開催日が近い順</option>
            <option value="title">研修名順</option>
            <option value="sessions">日程が多い順</option>
          </select>
        </label>
      </div>
      <div class="course-grid" id="courseGrid"></div>
      <div class="timeline hidden" id="timeline"></div>
    </section>
  </main>

  <footer>
    <div class="shell">掲載元：<span id="sourceFile"></span> ／ HTML更新日：2026年9月1日</div>
  </footer>

igator.all-different.co.jp/app/gate/trn/detail/11iUn7ChJZ7LwBf47my4/","online":false,"sessions":[{"date":"2026-12-11","weekday":"金","start":"09:00","end":"11:00","part":""},{"date":"2027-03-12","weekday":"金","start":"16:30","end":"18:30","part":""}],"firstDate":"2026-12-11","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["経営層"]},{"id":"Planning&Control-4","category":"計画・管理","categoryKey":"Planning&Control","number":4,"title":"ストーリーで学ぶ ビジネスリーダー研修＜全体編＞","summary":"組織を率いる管理職・リーダーは、組織の成果を出すという重責を担っています。では、組織としての成果を出し続けるために、何を実践する必要があるのでしょうか。\n本研修は、あるビジネスリーダーの行動をまとめた小説形式のストーリーを読み進めながら、組織として成果を出すために必要な要素の全体像をつかんでいただく研修です。他社の参加者とのディスカッションを通じ、今後取り組むべきことや課題について考えます。\n*「ストーリーで学ぶビジネスリーダー研修」シリーズは各回完結型です。受講順序はありません","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/12e86PuH5vk41i57Ur3c/","online":false,"sessions":[{"date":"2026-10-22","weekday":"木","start":"10:00","end":"17:00","part":""},{"date":"2026-11-25","weekday":"水","start":"10:00","end":"17:00","part":""},{"date":"2026-12-10","weekday":"木","start":"10:00","end":"17:00","part":""},{"date":"2027-01-12","weekday":"火","start":"10:00","end":"17:00","part":""},{"date":"2027-02-18","weekday":"木","start":"10:00","end":"17:00","part":""},{"date":"2027-03-23","weekday":"火","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-10-22","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-5","category":"計画・管理","categoryKey":"Planning&Control","number":5,"title":"ストーリーで学ぶ ビジネスリーダー研修＜ビジョン設定・仕事の構想編＞","summary":"ビジネスリーダーが組織を率いて目標を達成するためには、適切なビジョンや方針、戦略など、先を見据えた方向性をメンバーに示す必要があります。では、ビジョンや方針、戦略などを設定するには、どのようなことを、どのような順番で考えたらよいのでしょうか。\n本研修では、あるビジネスリーダーの行動をまとめた小説形式のストーリーを読み進めながら、自分自身がビジョンや戦略などをどのように設定しているのかを振り返ります。他社の参加者とのディスカッションを通じ、今後取り組むべきことや課題について考えます。\n*「ストーリーで学ぶビジネスリーダー研修」シリーズは各回完結型です。受講順序はありません","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/14Tc15C743ojjOfgs3j9/","online":false,"sessions":[{"date":"2026-11-18","weekday":"水","start":"10:00","end":"17:00","part":""},{"date":"2027-03-19","weekday":"金","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-11-18","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-6","category":"計画・管理","categoryKey":"Planning&Control","number":6,"title":"ストーリーで学ぶ ビジネスリーダー研修＜マネジメント（PDCA）/仕事の動機づけ編＞","summary":"成果を出し続ける組織を実現するには、状況に応じて適切にPDCAサイクルを廻していく必要があります。また、実行するメンバーの仕事に対する動機づけも非常に重要な要素です。\n本研修では、あるビジネスリーダーの行動をまとめた小説形式のストーリーを読み進めながら、自分自身のPDCAの廻し方やメンバーの仕事に対する動機づけについて振り返ります。他社の参加者とのディスカッションを通じ、今後取り組むべきことや課題について考えます。\n*「ストーリーで学ぶビジネスリーダー研修」シリーズは各回完結型です。受講順序はありません","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1629v175KjHg8QLs9L82/","online":false,"sessions":[{"date":"2026-11-12","weekday":"木","start":"10:00","end":"17:00","part":""},{"date":"2027-02-15","weekday":"月","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-11-12","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-7","category":"計画・管理","categoryKey":"Planning&Control","number":7,"title":"管理職のための部下育成シリーズ＜時間力＞","summary":"限られた時間の中で成果を出すことが求められる昨今、タイムマネジメントの重要性がますます高まっています。\n本研修では、管理職の方を対象に、部下の「時間力」を高める具体的な指導ポイントを考えていきます。今後の部下育成のヒントをお持ち帰りください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1692SOBkOoyBsIm8q9u5/","online":false,"sessions":[{"date":"2026-12-04","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2027-03-17","weekday":"水","start":"09:30","end":"11:30","part":""}],"firstDate":"2026-12-04","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-8","category":"計画・管理","categoryKey":"Planning&Control","number":8,"title":"【公開型ライブオンライン研修】管理職のための部下育成シリーズ＜時間力＞","summary":"限られた時間の中で成果を出すことが求められる昨今、タイムマネジメントの重要性がますます高まっています。\n本研修では、管理職の方を対象に、部下の「時間力」を高める具体的な指導ポイントを考えていきます。今後の部下育成のヒントをお持ち帰りください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1692SOBkOoyBsIm8q9u5/","online":true,"sessions":[{"date":"2026-10-13","weekday":"火","start":"13:30","end":"15:30","part":""},{"date":"2026-11-24","weekday":"火","start":"16:30","end":"18:30","part":""},{"date":"2026-12-10","weekday":"木","start":"13:30","end":"15:30","part":""},{"date":"2027-01-15","weekday":"金","start":"13:30","end":"15:30","part":""},{"date":"2027-02-09","weekday":"火","start":"13:30","end":"15:30","part":""},{"date":"2027-03-10","weekday":"水","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-10-13","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-9","category":"計画・管理","categoryKey":"Planning&Control","number":9,"title":"［管理職向け］目標の立て方のコツ","summary":"目標設定は、部下が自律自走し、期待されている成果を出すために必要不可欠な要素です。しかし、自部門、部下の目標設定に取り組む中で、「部下に押し付けてしまっている」「目標設定をうまくサポートできず、納得させられない」など、目標設定の進め方に課題や不安を抱える管理職の方が多くいらっしゃいます。\n本研修では、管理職の方を対象に、目標を立てる意義や、部下のモチベーションを高める目標とは何かなど、自部門および部下の目標を設定する際に理解しておきたい要素をお伝えします。目標の中身は部門や職種、個人によって変わりますが、本研修は、必ずおさえてほしい共通のポイントを体系的に学べる内容となっています。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/16ClyC8odSzd3571GXZz/","online":false,"sessions":[{"date":"2026-12-15","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-02-08","weekday":"月","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-12-15","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-10","category":"計画・管理","categoryKey":"Planning&Control","number":10,"title":"【公開型ライブオンライン研修】［管理職向け］目標の立て方のコツ","summary":"目標設定は、部下が自律自走し、期待されている成果を出すために必要不可欠な要素です。しかし、自部門、部下の目標設定に取り組む中で、「部下に押し付けてしまっている」「目標設定をうまくサポートできず、納得させられない」など、目標設定の進め方に課題や不安を抱える管理職の方が多くいらっしゃいます。\n本研修では、管理職の方を対象に、目標を立てる意義や、部下のモチベーションを高める目標とは何かなど、自部門および部下の目標を設定する際に理解しておきたい要素をお伝えします。目標の中身は部門や職種、個人によって変わりますが、本研修は、必ずおさえてほしい共通のポイントを体系的に学べる内容となっています。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/16ClyC8odSzd3571GXZz/","online":true,"sessions":[{"date":"2026-10-21","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2026-11-19","weekday":"木","start":"16:30","end":"18:30","part":""},{"date":"2026-12-16","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-01-19","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2027-02-16","weekday":"火","start":"16:30","end":"18:30","part":""},{"date":"2027-03-12","weekday":"金","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-10-21","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-11","category":"計画・管理","categoryKey":"Planning&Control","number":11,"title":"［管理職向け］組織目標を達成するための指標の立て方","summary":"組織の目標を達成するには、「このままの動きで目標を達成できそうかどうか」を見極めるための指標を設ける必要があります。\n本研修では、管理職の方を対象に、目標達成につながる指標設定の考え方である「KGI/KPI」の設定・活用方法をお伝えします。自組織の目標達成度を上げたい方、KGI/KPIについての理解を深めたい方はぜひご参加ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/16pEk89Xxv6TK54V7713/","online":false,"sessions":[{"date":"2026-11-12","weekday":"木","start":"09:30","end":"11:30","part":""},{"date":"2027-02-22","weekday":"月","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-11-12","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-12","category":"計画・管理","categoryKey":"Planning&Control","number":12,"title":"［管理職向け］PDCAの廻し方","summary":"成果を出し続ける組織をつくるには、PDCAサイクルを適切に廻すことが必要不可欠です。しかし実際には、「部下一人ひとりの活動が、目標達成に向かっているかわからない」「組織内で、同じようなトラブルやミスが起きがちである」「行動はしているが成果が出ていない」･･･など、PDCAの廻し方に課題を抱えている管理職の方が多くいらっしゃいます。\n本研修では、管理職の方を対象に、日々の業務品質を高めるために欠かせないPDCAサイクルの考え方と実行するポイントをお伝えします。他社の参加者とのディスカッションも交えて、実践で成果を出すために必要な要素を学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/186e8dMI8EgRyV31jiUR/","online":false,"sessions":[{"date":"2026-10-16","weekday":"金","start":"09:30","end":"11:30","part":""},{"date":"2026-11-19","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-02-16","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-03-19","weekday":"金","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-16","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-13","category":"計画・管理","categoryKey":"Planning&Control","number":13,"title":"［管理職向け］アクションプランの立て方","summary":"管理職の重要な責務は、組織の目標を達成し、成果を出すことであり、組織の目標はメンバーが行動することではじめて達成できます。\nそのため、メンバーが目標達成に向かって取るべき行動を具体化した行動計画（アクションプラン）を立てる必要があります。\n本研修では、管理職の方を対象に、目標をアクションプランへ落とし込むためのポイントをお伝えします。アクションプラン作成時の留意事項と作成の基本ステップを、自組織の振り返りや他社の参加者とのディスカッションを交えて学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/19SY8eSfQV23DO2KJf1w/","online":false,"sessions":[{"date":"2026-10-30","weekday":"金","start":"09:30","end":"11:30","part":""},{"date":"2027-02-12","weekday":"金","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-30","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-14","category":"計画・管理","categoryKey":"Planning&Control","number":14,"title":"【公開型ライブオンライン研修】［管理職向け］アクションプランの立て方","summary":"管理職の重要な責務は、組織の目標を達成し、成果を出すことであり、組織の目標はメンバーが行動することではじめて達成できます。\nそのため、メンバーが目標達成に向かって取るべき行動を具体化した行動計画（アクションプラン）を立てる必要があります。\n本研修では、管理職の方を対象に、目標をアクションプランへ落とし込むためのポイントをお伝えします。アクションプラン作成時の留意事項と作成の基本ステップを、自組織の振り返りや他社の参加者とのディスカッションを交えて学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/19SY8eSfQV23DO2KJf1w/","online":true,"sessions":[{"date":"2026-12-01","weekday":"火","start":"13:30","end":"15:30","part":""},{"date":"2027-02-16","weekday":"火","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-12-01","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["管理職"]},{"id":"Planning&Control-15","category":"計画・管理","categoryKey":"Planning&Control","number":15,"title":"次期管理職養成研修＜全体概要編＞","summary":"何の準備もしないまま管理職に昇進すると、「管理職に求められる役割」と「プレイヤー時代に求められていた役割」の違いに苦しむことになってしまいます。\n本研修は、次期管理職候補となる中堅社員の方を対象に、管理職に求められる要素をお伝えする研修です。次期管理職候補として、「今、何を意識して行動すべきか」を、他社の参加者とのディスカッションも交え考えていきます。\n*「全体概要編」の後は、「パラダイムシフト編」「フォロワーシップ編」をご受講ください","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/19o9Y1ih9xr16QY36ccJ/","online":false,"sessions":[{"date":"2026-10-23","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2026-11-24","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-01-18","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2027-02-24","weekday":"水","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-23","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["中堅・ベテラン"]},{"id":"Planning&Control-16","category":"計画・管理","categoryKey":"Planning&Control","number":16,"title":"次期管理職養成研修＜パラダイムシフト編＞","summary":"何の準備もしないまま管理職に昇進すると、「管理職に求められる役割」と「プレイヤー時代に求められていた役割」の違いに苦しむことになってしまいます。\n本研修は、次期管理職候補となる中堅社員の方を対象に、管理職に求められる要素をお伝えする研修です。「パラダイムシフト編」では、部門のメンバーから部門の長である管理職になるために必要な「視座の高め方」に焦点を当て、物事の捉え方や考え方（パラダイム）を広げるためのポイントを、ワークを交えて学んでいきます。\n*「次期管理職養成研修＜全体概要編＞」を受講された方を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1CQn6867KZ2xPF1zIfOf/","online":false,"sessions":[{"date":"2026-11-26","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-01-27","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-02-19","weekday":"金","start":"09:30","end":"11:30","part":""},{"date":"2027-03-25","weekday":"木","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-11-26","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["中堅・ベテラン"]},{"id":"Planning&Control-17","category":"計画・管理","categoryKey":"Planning&Control","number":17,"title":"次期管理職養成研修＜フォロワーシップ編＞","summary":"何の準備もしないまま管理職に昇進すると、「管理職に求められる役割」と「プレイヤー時代に求められていた役割」の違いに苦しむことになってしまいます。\n本研修は、次期管理職候補となる中堅社員の方を対象に、管理職に求められる要素をお伝えする研修です。「フォロワーシップ編」では、管理職の土台となる「フォロワーシップ」に焦点を当て、「フォロワーシップとは何か」「フォロワーシップ力の高め方」を、ワークを交えて学んでいただきます。ご自身のフォロワーシップの傾向を知る機会としてもご活用ください。\n*「次期管理職養成研修＜全体概要編＞」を受講された方を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1EVkhkbp1SBLH45I1inD/","online":false,"sessions":[{"date":"2026-10-22","weekday":"木","start":"09:30","end":"11:30","part":""},{"date":"2026-11-20","weekday":"金","start":"09:30","end":"11:30","part":""},{"date":"2026-12-14","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2027-02-10","weekday":"水","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-22","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["中堅・ベテラン"]},{"id":"Planning&Control-18","category":"計画・管理","categoryKey":"Planning&Control","number":18,"title":"『体感型』チームビルディング研修","summary":"チーム（組織）は、形成された後、混乱期を経て安定し、パフォーマンスを発揮するというプロセスを踏むことが知られ、それぞれのプロセスによってチームに求められるアクションは変わってきます。\n本研修は、「自分の属しているチーム（組織）がより大きな成果を上げるためには」をテーマにした研修です。チームに貢献するために必要となるチームビルディングの理論やアクションを、他社の参加者とのワークを通じて学んでいきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1H78cEsm8V87Ns55gp32/","online":false,"sessions":[{"date":"2026-10-16","weekday":"金","start":"14:00","end":"17:00","part":""},{"date":"2026-10-27","weekday":"火","start":"09:30","end":"12:30","part":""},{"date":"2026-11-06","weekday":"金","start":"09:30","end":"12:30","part":""},{"date":"2026-11-24","weekday":"火","start":"14:00","end":"17:00","part":""},{"date":"2026-12-18","weekday":"金","start":"14:00","end":"17:00","part":""},{"date":"2027-01-27","weekday":"水","start":"09:30","end":"12:30","part":""},{"date":"2027-02-10","weekday":"水","start":"14:00","end":"17:00","part":""},{"date":"2027-02-25","weekday":"木","start":"09:30","end":"12:30","part":""},{"date":"2027-03-05","weekday":"金","start":"14:00","end":"17:00","part":""},{"date":"2027-03-24","weekday":"水","start":"14:00","end":"17:00","part":""}],"firstDate":"2026-10-16","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["中堅・ベテラン"]},{"id":"Planning&Control-19","category":"計画・管理","categoryKey":"Planning&Control","number":19,"title":"プロジェクトマネジメントの全体像","summary":"プロジェクト責任者は、プロジェクトを成功に導くために、いつ、何を、どのような手順で進めればよいのかを体系的に理解する必要があります。\n本研修は、非IT業の中堅社員の方を対象に、プロジェクトマネジメントの全体像をお伝えする研修です。「プロジェクトとは何なのか」から始まり、構想、計画立案、実行、終結まで、プロジェクトマネジメントのポイントを網羅的に学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1Iz32coonix4U7hJ1W4l/","online":false,"sessions":[{"date":"2026-10-19","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2026-12-18","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-01-13","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2027-02-16","weekday":"火","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-10-19","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["中堅・ベテラン"]},{"id":"Planning&Control-20","category":"計画・管理","categoryKey":"Planning&Control","number":20,"title":"ビジネス判断力向上研修","summary":"ビジネスでは、社内・社外の交渉、トラブル対応、業務の優先順位の設定、組織の戦略策定など、様々な状況で判断が要求されます。そして変化の激しい現代のビジネス環境では、一人ひとりの適切な判断力の発揮が必要不可欠です。\n本研修では、中堅社員を対象に、複雑な状況下でも最適な判断を下せるようになるための判断のプロセスをご紹介します。状況把握や選択肢の列挙、判断が及ぼす影響の考慮など、ケーススタディを交えて学んでいきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1JunRqJ26N96U7vLj6VS/","online":false,"sessions":[{"date":"2026-10-06","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2026-11-26","weekday":"木","start":"09:30","end":"11:30","part":""},{"date":"2026-12-03","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-01-08","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-02-10","weekday":"水","start":"09:30","end":"11:30","part":""},{"date":"2027-03-17","weekday":"水","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-06","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["中堅・ベテラン"]},{"id":"Planning&Control-21","category":"計画・管理","categoryKey":"Planning&Control","number":21,"title":"抜け漏れなく仕事を進めるためのタスク分解","summary":"タスク分解は、「プロジェクト運営」や「個人の業務管理」においておさえておかなければならないスキルの一つです。タスク分解が適切にできていないと、重要な仕事を見落としたり誤った成果物を作ったりしてしまいます。\n本研修では、中堅社員の方を対象に、抜け漏れのないタスク分解を行うための方法をお伝えします。仕事におけるゴールの設定方法や、ゴールからタスクへの分解方法を学びます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1Jvn9gchKUc9qTfytURV/","online":false,"sessions":[{"date":"2026-10-23","weekday":"金","start":"09:30","end":"11:30","part":""},{"date":"2026-11-04","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2026-11-18","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2026-12-02","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-01-12","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-01-25","weekday":"月","start":"09:30","end":"11:30","part":""},{"date":"2027-02-19","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-03-18","weekday":"木","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-23","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["中堅・ベテラン"]},{"id":"Planning&Control-22","category":"計画・管理","categoryKey":"Planning&Control","number":22,"title":"仕事の進捗管理入門","summary":"進捗管理では、時間の見積もりやスケジュール策定など、計画段階から実行中を通して状況を的確に把握し、コントロールしていく力が求められます。\n本研修は、はじめて進捗管理を行う中堅社員を対象に、進捗管理の全体像やコツをつかんでいただく研修です。進捗管理のプロセスを分解し、各プロセスにおける注意点やポイントをお伝えするほか、進捗管理を妨げる要因についても紹介し、進捗管理を実行するうえでの基本姿勢を学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1Key1PRBTe4tX1FJR3sP/","online":false,"sessions":[{"date":"2026-10-13","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2026-10-28","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2026-11-16","weekday":"月","start":"16:00","end":"18:00","part":""},{"date":"2026-12-23","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-01-13","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-02-25","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-03-06","weekday":"土","start":"10:00","end":"12:00","part":""},{"date":"2027-03-26","weekday":"金","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-13","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["中堅・ベテラン"]},{"id":"Planning&Control-23","category":"計画・管理","categoryKey":"Planning&Control","number":23,"title":"［若手向け］目的思考のすすめ","summary":"目的を常に意識しながら仕事に取り組むことは、成果を生み出すうえでの大切なポイントです。ただ、実際仕事をしていると、「仕事の目的や勘所がわからない」「仕事を進めていく中で目的がぶれてしまう」といったことが起きてしまいがちです。\n本研修では、若手社員を対象に、目的を常に意識して仕事に取り組む方法をお伝えします。ケーススタディを通じて、「仕事の目的をはっきりと伝えてもらえない」「仕事に取り組むうちに目的を見失ってしまった」ときの対処の仕方も学びます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1MF8V1k511U4ofXOEXOZ/","online":false,"sessions":[{"date":"2026-10-20","weekday":"火","start":"09:00","end":"11:00","part":""},{"date":"2026-11-11","weekday":"水","start":"16:30","end":"18:30","part":""},{"date":"2026-12-04","weekday":"金","start":"13:30","end":"15:30","part":""},{"date":"2027-01-27","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-02-19","weekday":"金","start":"13:30","end":"15:30","part":""},{"date":"2027-03-19","weekday":"金","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-10-20","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["若手"]},{"id":"Planning&Control-24","category":"計画・管理","categoryKey":"Planning&Control","number":24,"title":"［若手向け］マルチタスクの進め方","summary":"「業務が増え、今までできていたことでもミスしてしまう」「業務が多岐にわたると生産性が落ちてしまう」などのお悩みはないでしょうか。\n本研修は、一通りの業務を覚え、任される仕事が増えてきた若手社員を対象に、マルチタスクをこなすために必要な考え方や要素をお伝えする研修です。ケーススタディを通じて、業務の優先順位づけや、集中力を持続させながら仕事を進めるためのポイントを学んでいきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1NCO29rRfLRl71vOq4wJ/","online":false,"sessions":[{"date":"2026-10-08","weekday":"木","start":"14:00","end":"16:30","part":""},{"date":"2026-10-30","weekday":"金","start":"10:00","end":"12:30","part":""},{"date":"2026-11-05","weekday":"木","start":"14:00","end":"16:30","part":""},{"date":"2026-11-24","weekday":"火","start":"14:00","end":"16:30","part":""},{"date":"2026-12-07","weekday":"月","start":"14:00","end":"16:30","part":""},{"date":"2026-12-16","weekday":"水","start":"14:00","end":"16:30","part":""},{"date":"2027-01-08","weekday":"金","start":"10:00","end":"12:30","part":""},{"date":"2027-01-28","weekday":"木","start":"10:00","end":"12:30","part":""},{"date":"2027-02-26","weekday":"金","start":"14:00","end":"16:30","part":""},{"date":"2027-03-08","weekday":"月","start":"14:00","end":"16:30","part":""},{"date":"2027-03-30","weekday":"火","start":"10:00","end":"12:30","part":""}],"firstDate":"2026-10-08","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["若手"]},{"id":"Planning&Control-25","category":"計画・管理","categoryKey":"Planning&Control","number":25,"title":"タイムマネジメント","summary":"ビジネスの世界は毎日が時間との戦いです。「時間が足りない」「残業が多い」･･･もしそのように感じているとしたら、一度自分の時間の使い方を振り返り、もっとうまく時間を使うための改善策を考えてみましょう。\n本研修は、若手社員を対象とした研修で、最初に時間の使い方の現状診断を行っていただきます。タイムマネジメントのノウハウを理解したうえで、明日からの実行につなげられるような改善策も検討していきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1O1O5GMz51h39m2KK1g5/","online":false,"sessions":[{"date":"2026-10-06","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2026-10-20","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2026-10-30","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2026-11-12","weekday":"木","start":"16:00","end":"18:00","part":""},{"date":"2026-11-18","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2026-11-26","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2026-12-05","weekday":"土","start":"10:00","end":"12:00","part":""},{"date":"2026-12-15","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-01-21","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-01-28","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-02-09","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2027-02-26","weekday":"金","start":"16:00","end":"18:00","part":""},{"date":"2027-03-17","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-03-30","weekday":"火","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-06","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["若手"]},{"id":"Planning&Control-26","category":"計画・管理","categoryKey":"Planning&Control","number":26,"title":"覚悟のタイムマネジメント","summary":"タイムマネジメントの目的は、成果を出すために、仕事の進め方・やり方を管理することです。そのためには、効率化だけでなく、今自分が本来やるべき仕事に集中することが非常に重要です。\n本研修では、「『今』『自分』が『本来』やるべきではない仕事をやらない」をテーマに、一歩踏み込んだタイムマネジメントのポイントをお伝えします。\n*「タイムマネジメント」研修の受講が前提です\n*ご自身で仕事の取捨選択を行える裁量のある方を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1YJI8qoC6I74k4kZ1jHO/","online":false,"sessions":[{"date":"2026-11-20","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2026-12-16","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-01-22","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-02-17","weekday":"水","start":"16:00","end":"18:00","part":""},{"date":"2027-03-25","weekday":"木","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-11-20","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["中堅・ベテラン"]},{"id":"Planning&Control-27","category":"計画・管理","categoryKey":"Planning&Control","number":27,"title":"仕事の進め方の基本","summary":"会社が新人・若手に期待することは何でしょうか。たくさんの期待がある中、その期待に応える第一歩は、頼まれたことを必ずやり切ることで、これこそが仕事の土台です。仕事の進め方の基本がしっかりできている人は、ビジネスパーソンとして信頼され、次の仕事が回ってきます。\n本研修では、社会人経験が浅い若手社員を対象に、「頼まれたことを必ずやり切る」ための仕事の進め方をお伝えします。上司から仕事を依頼されたときの仕事の受け方や計画の立て方、報連相のポイントなどを、ケーススタディを交えて学んでいきます。\n*25歳以下または社会人経験3年未満の方を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1Yet1sgWL48FfpTE3b5I/","online":false,"sessions":[{"date":"2026-10-06","weekday":"火","start":"13:30","end":"15:30","part":""},{"date":"2026-10-21","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2026-10-26","weekday":"月","start":"13:30","end":"15:30","part":""},{"date":"2026-11-04","weekday":"水","start":"16:30","end":"18:30","part":""},{"date":"2026-11-19","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2026-11-26","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2026-12-03","weekday":"木","start":"16:30","end":"18:30","part":""},{"date":"2026-12-15","weekday":"火","start":"09:00","end":"11:00","part":""},{"date":"2026-12-18","weekday":"金","start":"16:30","end":"18:30","part":""},{"date":"2027-01-08","weekday":"金","start":"13:30","end":"15:30","part":""},{"date":"2027-01-26","weekday":"火","start":"09:00","end":"11:00","part":""},{"date":"2027-02-15","weekday":"月","start":"13:30","end":"15:30","part":""},{"date":"2027-03-03","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-03-26","weekday":"金","start":"16:30","end":"18:30","part":""}],"firstDate":"2026-10-06","relatedThemeKey":"Planning&Control","relatedTheme":"計画・管理","targets":["若手","新人"]},{"id":"Communication-1","category":"コミュニケーション","categoryKey":"Communication","number":1,"title":"ストーリーで学ぶ ビジネスリーダー研修＜ビジョン・仕事の構想浸透/チームビルディング編＞","summary":"適切なビジョンや仕事の構想が描けても、それをメンバーに浸透させ、実行できる組織をつくらなければ絵に描いた餅になってしまいます。では、ビジョンや仕事の構想を組織に浸透させるには、何が必要なのでしょうか。\n本研修では、あるビジネスリーダーの行動をまとめた小説形式のストーリーを読み進めながら、ビジョンと仕事の構想を組織に浸透させられているか、チームビルディングを実践できているかを振り返ります。他社の参加者とのディスカッションを通じ、今後取り組むべきことや課題について考えていきます。\n*「ストーリーで学ぶビジネスリーダー研修」シリーズは各回完結型です。受講順序はありません","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1Zo2Y67Y916ZPj481HZ4/","online":false,"sessions":[{"date":"2026-12-09","weekday":"水","start":"10:00","end":"17:00","part":""},{"date":"2027-03-25","weekday":"木","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-12-09","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["管理職"]},{"id":"Communication-2","category":"コミュニケーション","categoryKey":"Communication","number":2,"title":"［管理職向け］部下を育成するために必要な要素","summary":"部下育成は上司にとって大切な業務の一つです。あなたはこれまで、部下を育てるためにどのようなことを行ってきましたか？その結果、部下は期待通りに育っていますか？\n本研修は、部下を育成するために必要な要素を、参加者同士の意見交換を交えて学んでいく研修です。部下育成で悩んでいる方、一生懸命やっているが、期待通りに部下が育たないとお悩みの方は、本研修に参加して課題解決のヒントをつかんでください。\n*部下を持つ管理職の方を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1d9egS6VzR36WcM8Ft2y/","online":false,"sessions":[{"date":"2026-12-04","weekday":"金","start":"10:00","end":"17:00","part":""},{"date":"2027-03-24","weekday":"水","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-12-04","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["管理職"]},{"id":"Communication-3","category":"コミュニケーション","categoryKey":"Communication","number":3,"title":"管理職のための部下育成シリーズ＜聴く力&話す力＞","summary":"部下のスキルアップを図るには、コミュニケーションの基本となる「聴く力」「話す力」を鍛えることが極めて重要です。そのため、管理職の皆さまが、「聴く力」「話す力」が必要となる場面を理解し、場面に応じた適切な指導を日ごろから行っていくことが大切です。\n本研修は、管理職の方を対象に、部下の「聴く力」「話す力」を高める具体的な指導法を考えていく研修です。今後の部下育成のヒントをお持ち帰りください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1dT4ZfNXoyW5Dy5xb3Jl/","online":false,"sessions":[{"date":"2026-10-22","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-01-21","weekday":"木","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-22","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["管理職"]},{"id":"Communication-4","category":"コミュニケーション","categoryKey":"Communication","number":4,"title":"管理職のための部下育成シリーズ＜書く力＞","summary":"「部下の書く力が乏しい」「昔に比べて若い社員の書く力が落ちている」というお悩みをよく耳にします。部下の書く力を伸ばすためには、上司が部下の文書添削に時間を割き、的確な指導を行う必要があります。では、管理職としてどのような指導を行えばよいのでしょうか。\n本研修では、管理職の方を対象に、部下の「書く力」を高める具体的な指導法を考えていきます。今後の部下育成のヒントをお持ち帰りください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1dlQ1u83Nj2ifND2yqZ9/","online":false,"sessions":[{"date":"2026-12-16","weekday":"水","start":"09:30","end":"11:30","part":""},{"date":"2027-03-23","weekday":"火","start":"09:30","end":"11:30","part":""}],"firstDate":"2026-12-16","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["管理職"]},{"id":"Communication-5","category":"コミュニケーション","categoryKey":"Communication","number":5,"title":"【基礎】部下を持つ管理職のためのコーチング","summary":"「懇切丁寧に教えているのに部下が育たない」「長年見てきた後輩が、全然独り立ちしない」という悩みを持つ管理職の方もいらっしゃるのではないでしょうか。自ら考えて行動し、課題を解決できる部下・後輩を育てるには、コーチングの手法を用いることが非常に有効です。\n本研修では、コーチングの概要や基本的な考え方を理解していただいたうえで、コーチングする際の落とし穴や注意点をお伝えします。\n*部下を持つ管理職の方を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1fD48C67L33oRW4f3Vsk/","online":false,"sessions":[{"date":"2026-10-20","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2026-11-18","weekday":"水","start":"09:30","end":"11:30","part":""},{"date":"2026-12-09","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-02-18","weekday":"木","start":"09:30","end":"11:30","part":""}],"firstDate":"2026-10-20","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["管理職"]},{"id":"Communication-6","category":"コミュニケーション","categoryKey":"Communication","number":6,"title":"［管理職向け］人事評価の基本＜心構えと評価編＞","summary":"部下の目標達成度や行動過程を上司が適切に評価することは、部下本人の自己成長に対する動機づけの根源です。\n本研修は、部下の評価を行う管理職の方を対象に、「自己成長の動機づけにつながる評価」に必要な要素をお伝えする研修です。部下を一次評価する際に求められる知識を簡潔にお伝えするとともに、評価の方法・ポイントを、他社の参加者とのディスカッションを交えて学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1h7uJe3s9HH55XO3MorP/","online":false,"sessions":[{"date":"2026-10-28","weekday":"水","start":"09:30","end":"11:30","part":""},{"date":"2026-11-16","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2026-12-17","weekday":"木","start":"09:30","end":"11:30","part":""},{"date":"2027-01-20","weekday":"水","start":"09:30","end":"11:30","part":""},{"date":"2027-02-25","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-03-15","weekday":"月","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-28","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["管理職"]},{"id":"Communication-7","category":"コミュニケーション","categoryKey":"Communication","number":7,"title":"［管理職向け］人事評価の基本＜フィードバック面談編＞","summary":"部下の目標達成度や行動過程を上司が適切に評価することは、部下本人の自己成長に対する動機づけの根源です。\n本研修は、部下を評価する管理職の方を対象に、評価結果を伝えるフィードバック面談で求められる要素をお伝えする研修です。面談を行う際に必要な知識や評価の方法・ポイントを、他社の参加者とのディスカッションも交えて学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1hVGUN7sjJ77K597nvC9/","online":false,"sessions":[{"date":"2026-11-26","weekday":"木","start":"16:00","end":"18:00","part":""},{"date":"2026-12-24","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-01-28","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-02-17","weekday":"水","start":"09:30","end":"11:30","part":""},{"date":"2027-03-19","weekday":"金","start":"09:30","end":"11:30","part":""}],"firstDate":"2026-11-26","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["管理職"]},{"id":"Communication-8","category":"コミュニケーション","categoryKey":"Communication","number":8,"title":"成果を出す会議のコツ研修","summary":"「特定のメンバーに発言が偏る」「会議の遅刻者が多い」など、会議についての悩みは尽きないものです。\n本研修では、会議で議長を務める方を対象に、会議の事前準備や運営の基本的なポイントをお伝えします。なお本研修は、ファシリテーションスキル、アイデア出し、意思決定などは対象としていません。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1hlgG6873Wo17B5L2l9M/","online":false,"sessions":[{"date":"2026-10-28","weekday":"水","start":"10:00","end":"12:30","part":""},{"date":"2027-01-29","weekday":"金","start":"14:00","end":"16:30","part":""}],"firstDate":"2026-10-28","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["中堅・ベテラン"]},{"id":"Communication-9","category":"コミュニケーション","categoryKey":"Communication","number":9,"title":"ファシリテーション入門","summary":"ファシリテーションとは、会議やワークショップにおいて、中立の立場で場を進行し、参加者の協働を促進させて様々な成果を生み出す支援をすることです。\n本研修は、社内会議や話し合いの場などでファシリテーション役を期待されている方を対象に、ファシリテーションのスキルを身につけていただく研修です。効果的・効率的な会議の運営や組織の課題解決など、ファシリテーションに必要なスキルや能力を網羅的に学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1ibSJzQetU9OTu16529V/","online":false,"sessions":[{"date":"2026-11-13","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-01-27","weekday":"水","start":"09:30","end":"11:30","part":""}],"firstDate":"2026-11-13","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["中堅・ベテラン"]},{"id":"Communication-10","category":"コミュニケーション","categoryKey":"Communication","number":10,"title":"ビジネス・ライティング＜わかりやすい文章の書き方編＞","summary":"ビジネスパーソンが身につけるべき基本的かつ重要なスキルは文章力です。ビジネスの現場では、文章で効率的にコミュニケーションを取る力が求められます。\n本研修では、相手が必要とする情報を明確にし、その情報を正確かつわかりやすい文章にするルールやポイントをお伝えします。「わかりにくい文章がいかに読みにくく、相手に負担をかけているか」を知り、わかりやすい文章を書く必要性を感じていただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1ipzd86k5KqIQ2q1N764/","online":false,"sessions":[{"date":"2026-10-02","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2026-10-15","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2026-10-29","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2026-11-06","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2026-11-24","weekday":"火","start":"16:00","end":"18:00","part":""},{"date":"2026-12-02","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2026-12-21","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2027-01-20","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2027-02-08","weekday":"月","start":"16:00","end":"18:00","part":""},{"date":"2027-02-17","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-03-04","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-03-19","weekday":"金","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-02","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["若手"]},{"id":"Communication-11","category":"コミュニケーション","categoryKey":"Communication","number":11,"title":"［若手向け］今日から始めるビジネス読解力トレーニング","summary":"ビジネスパーソンにとって、文章や言葉から物事や意図を正しく捉えるスキルは非常に重要です。\n読み間違いや聞き間違いは、仕事のミスやトラブルを引き起こしかねません。しかし、このスキルは見落とされがちで、ミスが起きても「うっかりミス」として見過ごされたり、「ちゃんと読んで」といった曖昧な指導になったりする場面が散見されます。\n本研修では、「ビジネスの場面において文章や言葉から物事や意図を正しく捉える力」を「ビジネス読解力」とし、練習問題に取り組みながら、間違えやすい読み方や、日常業務でのトレーニング方法を学びます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/FYhqxJ3Ohx8825c9kVM2/","online":false,"sessions":[{"date":"2026-11-06","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-02-26","weekday":"金","start":"09:30","end":"11:30","part":""}],"firstDate":"2026-11-06","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["若手","新人"]},{"id":"Communication-12","category":"コミュニケーション","categoryKey":"Communication","number":12,"title":"【公開型ライブオンライン研修】［若手向け］今日から始めるビジネス読解力トレーニング","summary":"ビジネスパーソンにとって、文章や言葉から物事や意図を正しく捉えるスキルは非常に重要です。\n読み間違いや聞き間違いは、仕事のミスやトラブルを引き起こしかねません。しかし、このスキルは見落とされがちで、ミスが起きても「うっかりミス」として見過ごされたり、「ちゃんと読んで」といった曖昧な指導になったりする場面が散見されます。\n本研修では、「ビジネスの場面において文章や言葉から物事や意図を正しく捉える力」を「ビジネス読解力」とし、練習問題に取り組みながら、間違えやすい読み方や、日常業務でのトレーニング方法を学びます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/FYhqxJ3Ohx8825c9kVM2/","online":true,"sessions":[{"date":"2026-11-20","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-01-29","weekday":"金","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-11-20","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["若手","新人"]},{"id":"Communication-13","category":"コミュニケーション","categoryKey":"Communication","number":13,"title":"【特訓】ビジネス・ライティング","summary":"ビジネスにおいて、メールは必要不可欠なコミュニケーションツールです。そのため、メール文書作成のスキルを高めることは、ビジネスパーソンにとって必須の課題となっています。\n本研修は、メール文書を徹底的に書くことで、メール文書作成のレベルアップを図る研修です。メールを作成する機会が多い、自身の書く力を試したい、実践形式で書く力を身につけたいと感じている方はぜひご参加ください。\n*メールを書く力のレベルアップが必要で、特訓を受ける覚悟のある方を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1jMIW5qxBRWk1voTD5HD/","online":false,"sessions":[{"date":"2026-11-26","weekday":"木","start":"10:00","end":"12:30","part":""},{"date":"2026-12-14","weekday":"月","start":"10:00","end":"12:30","part":""},{"date":"2027-02-16","weekday":"火","start":"14:00","end":"16:30","part":""},{"date":"2027-03-26","weekday":"金","start":"10:00","end":"12:30","part":""}],"firstDate":"2026-11-26","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["若手"]},{"id":"Communication-14","category":"コミュニケーション","categoryKey":"Communication","number":14,"title":"［新入社員向け］ビジネス・ライティング＜メール文書の型習得編＞","summary":"メールなどの文書を作成し、社内外の人に送る機会は多いものです。しかし、書き方によっては相手に意図が伝わらなかったり、知らず知らずのうちに相手を不快にさせてしまったりしているかもしれません。まずは、文書の「型」に則ること。これが、伝わるビジネス文書を作成する第一歩です。\n本研修は、新入社員を対象に、メール文書を「型」に沿って作成できるようになることを目的とした研修です。件名や宛名、本文などで、見落としがちなポイントを確認していきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1rkIDoNgM7u5fuDQj122/","online":false,"sessions":[{"date":"2026-10-09","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2026-10-26","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2026-11-05","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2026-11-18","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2026-12-15","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2027-01-25","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2027-02-24","weekday":"水","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-10-09","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["新人"]},{"id":"Communication-15","category":"コミュニケーション","categoryKey":"Communication","number":15,"title":"スライド作成の基本","summary":"プレゼンテーションソフトを使ってわかりやすいスライド資料を作成する力は、今やビジネスパーソンにとって必須のスキルです。しかし、過去の資料の編集や自己流からスタートすることが多く、何が正しいのかわからず苦手意識を持ってしまう方もいらっしゃるのではないでしょうか。\n本研修では、プレゼンテーションの目的やスライドに求められる役割をお伝えしたうえで、スライド資料を作成する際の基本ルールについて学んでいきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/1vSWjuZm16RRRWSKC7J2/","online":false,"sessions":[{"date":"2026-11-19","weekday":"木","start":"13:30","end":"15:30","part":""},{"date":"2027-02-24","weekday":"水","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-11-19","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["若手"]},{"id":"Communication-16","category":"コミュニケーション","categoryKey":"Communication","number":16,"title":"【公開型ライブオンライン研修】スライド作成の基本","summary":"プレゼンテーションソフトを使ってわかりやすいスライド資料を作成する力は、今やビジネスパーソンにとって必須のスキルです。しかし、過去の資料の編集や自己流からスタートすることが多く、何が正しいのかわからず苦手意識を持ってしまう方もいらっしゃるのではないでしょうか。\n本研修では、プレゼンテーションの目的やスライドに求められる役割をお伝えしたうえで、スライド資料を作成する際の基本ルールについて学んでいきます。","url":"h ry":"傾聴とは、単に人の話を聴くことではありません。相手の「真意」を引き出す聴き方をすることを指し、仕事を進める中で「傾聴」が必要な場面はたくさんあります。\n本研修は、中堅社員を対象に、ビジネスシーンにおける傾聴力の重要性や、傾聴に必要な具体的な技術を紹介する研修です。他社の参加者とのワークを通じて、自身の「傾聴力」を高めるための強化ポイントも見つけていただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/21e6cl1glj959RoXRl2U/","online":false,"sessions":[{"date":"2026-10-09","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2026-11-05","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2026-12-22","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-01-08","weekday":"金","start":"09:30","end":"11:30","part":""},{"date":"2027-02-17","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-03-04","weekday":"木","start":"16:00","end":"18:00","part":""}],"firstDate":"2026-10-09","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["中堅・ベテラン"]},{"id":"Communication-20","category":"コミュニケーション","categoryKey":"Communication","number":20,"title":"質問力の基本","summary":"採用面接、商談、部下との面談、お客さまからの問い合わせなど、ビジネスにおいて「質問をする」場面はたくさんあります。そのとき、あなたは相手の真意を聴き出すことができていますか。\n本研修は、中堅社員を対象に、相手の意図や考えを正確に把握するために必要な「質問のステップ」をお伝えする研修です。質問する際に考えるべきことやおさえるべきポイントを、体系的に紹介します。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/21urxT4i63741264izZH/","online":false,"sessions":[{"date":"2026-10-28","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2026-11-06","weekday":"金","start":"09:30","end":"11:30","part":""},{"date":"2027-01-18","weekday":"月","start":"09:30","end":"11:30","part":""},{"date":"2027-03-02","weekday":"火","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-28","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["中堅・ベテラン"]},{"id":"Communication-21","category":"コミュニケーション","categoryKey":"Communication","number":21,"title":"［若手向け］ビジネス・トーキング","summary":"社内での会議、上司への報告、部下への指示、お客さまへの説明など、ビジネスでは様々な場面で相手に「伝わる」話し方が求められます。\n本研修では、若手社員を対象に、ビジネス・トーキングでおさえるべき3ステップ（準備、実施、事後の確認）をお伝えします。相手に「伝わる」話し方のポイントを、他社の参加者とのワークを通 te":"2026-10-26","weekday":"月","start":"14:00","end":"17:00","part":""},{"date":"2026-11-19","weekday":"木","start":"14:00","end":"17:00","part":""},{"date":"2027-01-15","weekday":"金","start":"14:00","end":"17:00","part":""},{"date":"2027-02-22","weekday":"月","start":"14:00","end":"17:00","part":""},{"date":"2027-03-24","weekday":"水","start":"09:30","end":"12:30","part":""}],"firstDate":"2026-10-26","relatedThemeKey":"Communication","relatedTheme":"コミュニケーション","targets":["若手","新人"]},{"id":"Thinking-1","category":"思考力","categoryKey":"Thinking","number":1,"title":"管理職のための部下育成シリーズ＜考える力＞","summary":"部下の「考える力」を向上させるためには、ビジネスで必要な思考法を理解し、効果的な指導をしていくことが欠かせません。\n本研修は、管理職の方を対象に、ビジネスで用いる主な思考法やその活用場面を紹介することで、部下の「考える力」を育成する具体的なイメージをつかんでいただく研修です。今後の部下育成のヒントをお持ち帰りください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/295OjsJrrTbN1J24o8vi/","online":false,"sessions":[{"date":"2026-12-09","weekday":"水","start":"09:30","end":"11:30","part":""},{"date":"2027-03-11","weekday":"木","start":"09:30","end":"11:30","part":""}],"firstDate":"2026-12-09","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["管理職"]},{"id":"Thinking-2","category":"思考力","categoryKey":"Thinking","number":2,"title":"［若手向け］思考力の全体像","summary":"ビジネスには「思考力」が求められます。組織の課題を考える際の論理的な思考力、アイデアを出すための発想力、新しいものを生み出す創造力など、「思考力」といっても、ビジネスで求められる思考力は一つではありません。\n本研修は、若手社員を対象に、「思考力にはどのようなものがあるのか」といった全体像をお伝えする研修です。自身に不足している思考力を認識することで、思考力向上につなげていきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/296M9q4r8NBPsZgo53mT/","online":false,"sessions":[{"date":"2026-10-30","weekday":"金","start":"13:30","end":"15:30","part":""},{"date":"2027-01-21","weekday":"木","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-10-30","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["若手"]},{"id":"Thinking-3","category":"思考力","categoryKey":"Thinking","number":3,"title":"【基礎】ロジカル・シンキング","summary":"ロジカル・シンキングは、ビジネスパーソンにとって必要不可欠なスキルの一つです。ロジカル・シンキングが身についていると、物事を相手にわかりやすく伝えることができ、また、課題を把握して解決につなげることもできます。\n本研修では、若手社員を対象に、「ロジカル・シンキングとは何か？」「習得するためには何をすればよいのか？」を解説し、実践に結びつけるためのワークも行います。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/29MuO47gdQx57762WN8M/","online":false,"sessions":[{"date":"2026-10-02","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2026-10-15","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2026-10-30","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2026-11-04","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2026-11-12","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2026-11-26","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2026-12-01","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2026-12-05","weekday":"土","start":"14:00","end":"16:00","part":""},{"date":"2026-12-24","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-01-07","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-01-18","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2027-01-28","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-02-09","weekday":"火","start":"16:00","end":"18:00","part":""},{"date":"2027-02-15","weekday":"月","start":"16:00","end":"18:00","part":""},{"date":"2027-02-26","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2027-03-04","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-03-12","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-03-29","weekday":"月","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-10-02","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["若手"]},{"id":"Thinking-4","category":"思考力","categoryKey":"Thinking","number":4,"title":"論理的思考力ブラッシュアップ研修＜前編・後編＞","summary":"「論理的思考力について理解はしているが、どう業務に活かせばいいのかわからない」「適切な思考法を用いて課題や施策の検討ができるようになりたい」といった課題を抱えている方もいらっしゃるのではないでしょうか。\n本研修は、「【基礎】ロジカル・シンキング」研修の内容を踏まえ、さらに実践的な論理的思考力を身につけていく研修です。ワークやケーススタディを通じて、実践的に学んでいきます。\n*「【基礎】ロジカル・シンキング」を受講された方を対象とした研修です\n*前編・後編をセットでご予約ください。日程はあらかじめセットで決まっています。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2Efp3oBrjIXrZy27k71k/","online":false,"sessions":[{"date":"2026-10-27","weekday":"火","start":"13:00","end":"15:00","part":"前編"},{"date":"2026-11-24","weekday":"火","start":"13:00","end":"15:00","part":"後編"},{"date":"2027-02-17","weekday":"水","start":"10:00","end":"12:00","part":"前編"},{"date":"2027-03-10","weekday":"水","start":"10:00","end":"12:00","part":"後編"}],"firstDate":"2026-10-27","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["中堅・ベテラン"]},{"id":"Thinking-5","category":"思考力","categoryKey":"Thinking","number":5,"title":"ケースで学ぶ 論理的思考力ブラッシュアップ研修","summary":"ビジネスシーンが多様化する昨今、論理的思考力はビジネスパーソンにとって必須のスキルとなっています。\n本研修は、ロジカル・シンキングの研修にご参加いただき、基礎的な論理的思考力が身についている方を対象に、論理的思考力をさらに高めるための方法をお伝えする研修です。論理展開や要素間の関係といった基礎知識を踏まえたうえで、ケーススタディを通じてスキルアップを図ります。\n*「【基礎】ロジカル・シンキング」「論理的思考力ブラッシュアップ研修＜前編・後編＞」を受講した方を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2Ky7sMzM9y9X4O1ryq91/","online":false,"sessions":[{"date":"2026-12-24","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-03-25","weekday":"木","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-12-24","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["中堅・ベテラン"]},{"id":"Thinking-6","category":"思考力","categoryKey":"Thinking","number":6,"title":"［若手向け］クリエイティブ・シンキング","summary":"クリエイティブ・シンキングは、枠組みにとらわれずに発想・創造する思考法です。センスによる特別なスキルだと思われがちですが、ビジネスにおいて、真の課題を捉えたり解決に導いたりするために必要な、誰にでも身につけることができる思考スキルです。\n本研修では、若手社員を対象に、クリエイティブ・シンキングが求められる背景やその思考プロセスをお伝えするとともに、ビジネスにおいてどのように活用すればよいかについて学んでいきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2MSw8d5k91KS73b71SHC/","online":false,"sessions":[{"date":"2026-11-13","weekday":"金","start":"09:30","end":"11:30","part":""},{"date":"2027-03-24","weekday":"水","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-11-13","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["若手"]},{"id":"Thinking-7","category":"思考力","categoryKey":"Thinking","number":7,"title":"［若手向け］アイデアを出すための発想法","summary":"新しい商品の開発、業務の改善策の立案など、ビジネスでは「アイデア」が求められる場面が数多くあります。では、たくさんのアイデアを生み出すには、どのようにすればよいのでしょうか。\n本研修は、若手社員を対象に、アイデアを出すための基本的な考え方、手法をお伝えする研修です。ワークを通じて、アイデアをより多く生み出すための発想法を体感していただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2Ogyyt5MsCR9MU8SU8Rv/","online":false,"sessions":[{"date":"2026-12-18","weekday":"金","start":"13:30","end":"15:30","part":""},{"date":"2027-01-22","weekday":"金","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-12-18","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["若手"]},{"id":"Thinking-8","category":"思考力","categoryKey":"Thinking","number":8,"title":"クリティカル・シンキング","summary":"クリティカル・シンキングとは、物事を「批判的に見る」ことによって、正しい論理につなげる思考法です。\n本研修は、論理的思考（ロジカル・シンキング）が十分できている方を対象に、さらなる思考力の向上を目指す研修です。正しいロジックを用いるのはもちろんのこと、ロジックの前提や思考の流れを批判的（クリティカル）に見直すことの重要性を理解していただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2Ugq1qoY2wWRIX7eh67x/","online":false,"sessions":[{"date":"2026-10-19","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2026-11-11","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2026-12-22","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2027-01-26","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2027-02-19","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-03-11","weekday":"木","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-19","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["中堅・ベテラン"]},{"id":"Thinking-9","category":"思考力","categoryKey":"Thinking","number":9,"title":"［若手向け］データの読み方入門","summary":"データを読み解く力は、昨今のビジネスシーンにおいて必須の能力となっています。\n本研修では、日々の業務で情報収集を行う若手社員を対象に、「データに込められたメッセージを鵜呑みにしない」方法をお伝えします。発信者やソースを意識することで、そのデータの意図や背景を正しく読み解けるようになりましょう。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2cgs3Wg6RFX3n471Pf94/","online":false,"sessions":[{"date":"2026-11-11","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-02-18","weekday":"木","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-11-11","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["若手"]},{"id":"Thinking-10","category":"思考力","categoryKey":"Thinking","number":10,"title":"はじめての統計分析","summary":"データ分析は、ビジネスの意思決定に欠かすことのできない極めて重要な要素です。\n本研修では、日々の業務でデータ分析に携わって間もない方、また、これからデータ分析に携わっていく方を対象に、様々なケースを通じて分析の手法やコツをお伝えします。目的に応じた手法を選択する重要性を理解し、課題把握や問題解決など、ビジネスに有効活用できる知識を得ていただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2ckhId3JV929nnCHOUyu/","online":false,"sessions":[{"date":"2026-12-09","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2027-03-03","weekday":"水","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-12-09","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["中堅・ベテラン"]},{"id":"Thinking-11","category":"思考力","categoryKey":"Thinking","number":11,"title":"コンセプチュアルスキルの高め方","summary":"仕事の幅が広がるにつれ、「業務の生産性を高める」「スキルを習得する」「自分自身を成長させる」ことの重要性が増していきます。これらを実現するには、物事を概念化する力、すなわち「コンセプチュアルスキル」が必要です。\n本研修では、発生した事象や経験した事柄から物事の本質を捉える力である「コンセプチュアルスキル」の身につけ方や高め方をお伝えします。\n*本研修は中堅社員の方を対象としています","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2dvW85bX7e319etT3BXz/","online":false,"sessions":[{"date":"2026-10-20","weekday":"火","start":"16:00","end":"18:00","part":""},{"date":"2026-11-25","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2026-12-09","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-01-18","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2027-02-25","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-03-18","weekday":"木","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-10-20","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["中堅・ベテラン"]},{"id":"Thinking-12","category":"思考力","categoryKey":"Thinking","number":12,"title":"思考を深めるための情報整理術","summary":"会議で出される意見やお客さまアンケート、日々の経済のニュースなど、私たちの身の回りにはたくさんの情報があふれています。仕事では、それらの情報をもとに状況を理解したり、判断を下したりすることになりますが、人間の脳が一度に処理できる情報量には限界があります。\n本研修では、若手社員を対象に、大量の情報をわかりやすく整理し、正しい理解や判断につなげる方法をお伝えします。会議で出た意見をまとめる際や、依頼された複雑な仕事の内容を理解する際などに必要な考え方を、ケーススタディを交えて学んでいきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2g1Xnnn6lqgMDS8wzjWM/","online":false,"sessions":[{"date":"2026-10-28","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2026-11-24","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2027-01-27","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-02-19","weekday":"金","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-10-28","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["若手"]},{"id":"Thinking-13","category":"思考力","categoryKey":"Thinking","number":13,"title":"課題・施策を特定するための要素分解トレーニング","summary":"「クレーム再発の原因がわからない」「目標を達成するための適切な施策が打てない」など、仕事を進めるうえで悩んだことはありませんか。課題や施策を特定するためには、その仕事がどのような要素で構成されているのかを理解していなければなりません。\n本研修では、課題や施策を特定するための「要素分解」の技術をお伝えします。様々なケースを想定してトレーニングを行い、実務で活用できるレベルまでスキルを高めていただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2g62dnjJ72M33QJ65pJ7/","online":false,"sessions":[{"date":"2026-10-09","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2026-11-09","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2026-12-03","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-01-21","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-02-12","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2027-03-03","weekday":"水","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-09","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["中堅・ベテラン"]},{"id":"Thinking-14","category":"思考力","categoryKey":"Thinking","number":14,"title":"図解を用いた思考整理トレーニング","summary":"ビジネスでは、スピードが大事だとよくいわれます。そのため、現代のビジネスパーソンには、複雑な状況や大量の情報を適切かつ素早く把握、理解する能力が求められます。このような能力を高めるのに有効な手法が「図解」です。\n本研修では、情報を図に描いて整理するトレーニングを実施します。思考整理のプロセスをお伝えしつつ、演習を多く取り入れることで図を用いた思考整理手法を学んでいきます。\n*本研修は、マインドマップなど特定の図に絞ってトレーニングを行うものではありません","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2h4g9HuZIug2rzrZv5E4/","online":false,"sessions":[{"date":"2026-10-21","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2026-12-11","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-01-22","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2027-02-08","weekday":"月","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-21","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["中堅・ベテラン"]},{"id":"Thinking-15","category":"思考力","categoryKey":"Thinking","number":15,"title":"［新入社員向け］考える力の鍛え方","summary":"「ロジカル・シンキング」や「クリティカル・シンキング」など、思考力は社会人にとっての必須スキルです。これらの思考力を身につけるためになくてはならないのが、考える力＝考え続ける基礎体力です。\n本研修では、新入社員を対象に、考える力を鍛える必要性やその鍛え方をお伝えします。考える力はすぐに身につくものではありませんが、時間をかけて深く考え続けるワークや、限られた時間の中でアウトプットするワークなどを通じて、考える力の鍛え方を体感していただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2hrdWGm5y4n42PXh22hv/","online":false,"sessions":[{"date":"2026-10-22","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2026-10-29","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2026-11-09","weekday":"月","start":"13:30","end":"15:30","part":""},{"date":"2026-11-25","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2026-12-07","weekday":"月","start":"13:30","end":"15:30","part":""},{"date":"2026-12-23","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-01-13","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-02-17","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-03-23","weekday":"火","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-10-22","relatedThemeKey":"Thinking","relatedTheme":"思考力","targets":["新人"]},{"id":"Business Knowledge-1","category":"ビジネス知識","categoryKey":"Business Knowledge","number":1,"title":"経理・財務部課長の役割と実務","summary":"経理・財務の分野は専門的な知識と幅広い視野が求められ、そのマネジメントを任せられる人もそれ相応の知識を持っておく必要があります。\n本研修では、中堅・中小企業（非上場）で働く経理・財務部課長を対象に、管理者として求められる役割やその役割を果たすために必要なことを、ワークも交えて考えていきます。\n*経理・財務部課長を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2lug516eh32ZTyLuf1D3/","online":false,"sessions":[{"date":"2026-12-09","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2027-03-18","weekday":"木","start":"16:30","end":"18:30","part":""}],"firstDate":"2026-12-09","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["管理職"]},{"id":"Business Knowledge-2","category":"ビジネス知識","categoryKey":"Business Knowledge","number":2,"title":"人事・総務部課長の役割と実務","summary":"人事・総務部門の業務は、会社全体の将来に影響を与える重要な業務です。人事・総務部門には、日常的・手続き的な業務の遂行にとどまらず、会社の将来を見据えた基盤づくりを進める役割が求められます。\n本研修では、人事・総務部門が担うべき日常的な業務内容の確認に加え、将来を見据えてどのようなことを実行すべきかについてお伝えします。\n*人事・総務部課長を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2o4JtWMw48NX619DJ7WX/","online":false,"sessions":[{"date":"2026-12-16","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-03-17","weekday":"水","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-12-16","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["管理職"]},{"id":"Business Knowledge-3","category":"ビジネス知識","categoryKey":"Business Knowledge","number":3,"title":"［管理職向け］労務管理研修＜メンタルヘルスの基礎知識編＞","summary":"部下のメンタルヘルス不全を未然に防ぐために、管理職にはどのような行動が求められるでしょうか。また、やってはいけない行動とは何でしょうか。\n本研修では、管理職として知っておかなければならないメンタルヘルスに関する知識をお伝えします。職場でのメンタルヘルス不全防止に必要な知識のほか、部下がメンタルヘルス不全に陥った場合の対応策について、ワークを交えて学んでいただきます。なお、部下の職場復帰対応は含まれませんので、ご注意ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2o8rSzBnI7YLkdnCP2X8/","online":false,"sessions":[{"date":"2026-11-12","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2026-12-07","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2027-02-09","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-03-19","weekday":"金","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-11-12","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["管理職"]},{"id":"Business Knowledge-4","category":"ビジネス知識","categoryKey":"Business Knowledge","number":4,"title":"［管理職向け］労務管理研修＜セクハラ・パワハラの基礎知識編＞","summary":"セクハラ・パワハラを根絶させ、コンプライアンス意識の高い職場を実現するには、法律上の定義や、セクハラ・パワハラと認定される基準・要素を知っておくことが大前提です。\n本研修では、管理職の方を対象に、セクハラ・パワハラの最低限の知識をおさえていただきます。セクハラ・パワハラの定義や注意すべき言動といった概要に加え、相談を受けた際の振る舞いや対応のポイントもお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2q38oQ5H4wx4pK6giR9j/","online":false,"sessions":[{"date":"2026-10-21","weekday":"水","start":"16:00","end":"18:00","part":""},{"date":"2026-11-06","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2026-12-08","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2026-12-17","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-01-14","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-01-27","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2027-02-16","weekday":"火","start":"16:00","end":"18:00","part":""},{"date":"2027-03-11","weekday":"木","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-10-21","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["管理職"]},{"id":"Business Knowledge-5","category":"ビジネス知識","categoryKey":"Business Knowledge","number":5,"title":"［現場指導者向け］体系的に学ぶOJTの進め方","summary":"OJT（On-the-Job Training）を軸とした部下・後輩の育成は、多くの企業で実施されています。しかし、「“とりあえず”OJTを行っている」「OJTを行っていると言いつつも、実態が伴っていない」などの課題を抱えている企業も多いのではないでしょうか。\n本研修では、これからOJTを担当する方を対象に、業務を通じて部下・後輩の成長を促すために必要なOJTの手順を体系的にお伝えします。OJT指導者として、業務の量と質の選定、業務指示・依頼、業務遂行支援、内省支援に取り組む際のポイントをつかんでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2qhg2ZmI6m3ylrD9zWxO/","online":false,"sessions":[{"date":"2026-10-16","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2026-11-20","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2026-12-03","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-01-25","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2027-02-24","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-03-26","weekday":"金","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-10-16","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-6","category":"ビジネス知識","categoryKey":"Business Knowledge","number":6,"title":"若手社員に必要なビジネススキルの全体像","summary":"ビジネスパーソンには、様々なスキルが求められます。その中でどのようなスキルを身につける必要があるのか、お悩みの方もいらっしゃるのではないでしょうか。\n本研修では、若手社員を対象に、ビジネスパーソンとして必要なスキル・能力の全体像をお伝えするとともに、他社の参加者とのワークを交え、自分自身が何に注力すべきなのかについて考えていきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2qyeZ4d5rWo8M8GQRR95/","online":false,"sessions":[{"date":"2026-11-06","weekday":"金","start":"10:00","end":"17:00","part":""},{"date":"2027-01-27","weekday":"水","start":"10:00","end":"17:00","part":""},{"date":"2027-02-25","weekday":"木","start":"10:00","end":"17:00","part":""},{"date":"2027-03-29","weekday":"月","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-11-06","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-7","category":"ビジネス知識","categoryKey":"Business Knowledge","number":7,"title":"ビジネスマナー研修1＜良好な人間関係を築く5要素＞","summary":"ビジネスマナーは、仕事で関わる様々な人と良好な関係を築き、ビジネスを円滑に進めるために必要不可欠なものです。しかし、ビジネスマナーをきちんと学ぶ機会は、「入社時研修の一度きり」という方も多いのではないでしょうか。\n本研修では、「ビジネスマナーが仕事にどのような影響を与えるのか」を再確認したうえで、当社がまとめた「良好な人間関係を築く5つの要素」をご紹介します。ビジネスマナーに不安がある、社会人経験を積んだ今だからこそマナーを学び直したいという方は、ぜひご参加ください。\n*「新入社員研修」と内容が重複しています","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2t8Xhe5j77HU212D4Kye/","online":false,"sessions":[{"date":"2026-10-08","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2026-11-16","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2026-12-04","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2026-12-21","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2027-01-15","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2027-02-10","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2027-03-08","weekday":"月","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-10-08","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手","新人"]},{"id":"Business Knowledge-8","category":"ビジネス知識","categoryKey":"Business Knowledge","number":8,"title":"ビジネスマナー研修2＜ビジネスを円滑に進めるための形式＞","summary":"ビジネスマナーは、仕事で関わる様々な人と良好な関係を築き、ビジネスを円滑に進めるために必要不可欠なものです。しかし、ビジネスマナーをきちんと学ぶ機会は、「入社時研修の一度きり」という方も多いのではないでしょうか。\n本研修では、名刺交換や電話応対など、「ビジネスを円滑に進めるための形式」を学びます。ロールプレイングを通じて、「頭でわかる」という状態ではなく、「実践できる」状態を目指していただきます。\n*「新入社員研修」と内容が重複しています\n*ビジネスマナーの前提である「良好な人間関係を築く5つの要素」についてお伝えしている「ビジネスマナー研修1」からご受講いただくことをお勧めします","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2tiMMjTq674CxgilE3E8/","online":false,"sessions":[{"date":"2026-10-08","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2026-11-16","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2026-12-04","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-01-15","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-02-10","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-03-08","weekday":"月","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-08","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手","新人"]},{"id":"Business Knowledge-9","category":"ビジネス知識","categoryKey":"Business Knowledge","number":9,"title":"［若手向け］ケースで学ぶコンプライアンス","summary":"「コンプライアンス」という言葉は知っていても、正しい理解に自信がない方も多いのではないでしょうか。しかし、コンプライアンス違反は企業に重大な影響を及ぼすため、その意義をしっかり理解しておく必要があります。\n本研修は、若手社員を対象に、コンプライアンスに関する基礎知識をお伝えする研修です。身近にあるコンプライアンスが問われるケースを考えながら、業務に活かせる知識を学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2u5P84fF4n75S9MB15D1/","online":false,"sessions":[{"date":"2026-10-29","weekday":"木","start":"13:30","end":"15:30","part":""},{"date":"2026-11-20","weekday":"金","start":"13:30","end":"15:30","part":""},{"date":"2027-02-15","weekday":"月","start":"09:00","end":"11:00","part":""},{"date":"2027-03-25","weekday":"木","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-10-29","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-10","category":"ビジネス知識","categoryKey":"Business Knowledge","number":10,"title":"［若手向け］労務基礎知識","summary":"どのような職種であっても、労働者には法律上の権利や義務があります。しかし、それらを知らないまま働いてしまうと、法律や服務規程に違反するような言動を取ってしまうリスクが高まります。\n本研修では、第2新卒や社会人5年目くらいまでの若手社員を対象に、労務の基礎的な知識をお伝えします。就業規則や服務規程、労働時間に関する法令など、労働者として知っておかなければならない知識を学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2xDpsPq84f2T6yu1Jo4L/","online":false,"sessions":[{"date":"2026-12-16","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2027-03-17","weekday":"水","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-12-16","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-11","category":"ビジネス知識","categoryKey":"Business Knowledge","number":11,"title":"【公開型ライブオンライン研修】［若手向け］労務基礎知識","summary":"どのような職種であっても、労働者には法律上の権利や義務があります。しかし、それらを知らないまま働いてしまうと、法律や服務規程に違反するような言動を取ってしまうリスクが高まります。\n本研修では、第2新卒や社会人5年目くらいまでの若手社員を対象に、労務の基礎的な知識をお伝えします。就業規則や服務規程、労働時間に関する法令など、労働者として知っておかなければならない知識を学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/2xDpsPq84f2T6yu1Jo4L/","online":true,"sessions":[{"date":"2026-10-08","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2026-12-14","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2027-01-29","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2027-03-25","weekday":"木","start":"16:00","end":"18:00","part":""}],"firstDate":"2026-10-08","relate
