書・貸借対照表を見る方対象＞","summary":"決算書には、企業に関する様々な情報がつまっており、見方がわかれば企業の状況を数字で把握することができるようになります。\n本研修では、「損益計算書」「貸借対照表」の定義や構成、基本的な見方をお伝えします。決算書の見方を基礎から学びたい方向けの研修です。\n*初めて決算書を見る方を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/31nJl3OredsW4gEGYnyB/","online":false,"sessions":[{"date":"2026-10-13","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2026-10-23","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2026-11-18","weekday":"水","start":"16:00","end":"18:00","part":""},{"date":"2026-12-14","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2027-01-14","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-02-18","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-03-10","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-03-23","weekday":"火","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-13","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-18","category":"ビジネス知識","categoryKey":"Business Knowledge","number":18,"title":"基礎からはじめるビジネス教養＜売上・コストの捉え方編＞","summary":"多くの企業で「売上」や「利益」が重要視されています。しかし、日々の業務にどう結びつければよいか分からない、あるいは自分は営業職ではないので関係ないと思う方もいらっしゃるのではないでしょうか。\n本研修では、若手社員を対象に、「売上」や「利益」が企業にとって重要な理由や、「売上」「コスト」「キャッシュ」の基本的な考え方、会社にとってプラスになる行動をお伝えします。ビジネスパーソンとして身につけたい、売上やコストの捉え方を学ぶ研修です。ぜひご参加ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/Fgy8yhvq718q3by33yY2/","online":false,"sessions":[{"date":"2026-10-26","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2027-02-26","weekday":"金","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-10-26","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手","新人"]},{"id":"Business Knowledge-19","category":"ビジネス知識","categoryKey":"Business Knowledge","number":19,"title":"【公開型ライブオンライン研修】基礎からはじめるビジネス教養＜売上・コストの捉え方編＞","summary":"多くの企業で「売上」や「利益」が重要視されています。しかし、日々の業務にどう結びつければよいか分からない、あるいは自分は営業職ではないので関係ないと思う方もいらっしゃるのではないでしょうか。\n本研修では、若手社員を対象に、「売上」や「利益」が企業にとって重要な理由や、「売上」「コスト」「キャッシュ」の基本的な考え方、会社にとってプラスになる行動をお伝えします。ビジネスパーソンとして身につけたい、売上やコストの捉え方を学ぶ研修です。ぜひご参加ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/Fgy8yhvq718q3by33yY2/","online":true,"sessions":[{"date":"2026-11-09","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2027-02-25","weekday":"木","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-11-09","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手","新人"]},{"id":"Business Knowledge-20","category":"ビジネス知識","categoryKey":"Business Knowledge","number":20,"title":"【中級】経営数字（経営分析の基礎）＜損益計算書・貸借対照表が読める方対象＞","summary":"決算書には、企業に関する様々な情報がつまっており、見方がわかれば企業の状況を数字で把握することができるようになります。\n本研修では、主に定量分析（財務分析）で使用する分析指標を学びます。財務分析の4分野（成長性分析・収益性分析・生産性分析・安全性分析）についての指標を紹介し、ワークを通じて財務分析を体感していただきます。\n*業務で決算書分析が必要で、決算書が読める方を対象とした研修です\n*「【初級】経営数字＜初めて損益計算書・貸借対照表を見る方対象＞」の続編です\n*本研修では電卓をご用意ください","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/32y9DB86i6J1trbiHQ5N/","online":false,"sessions":[{"date":"2026-11-19","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2026-12-18","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2027-02-16","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-03-24","weekday":"水","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-11-19","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-21","category":"ビジネス知識","categoryKey":"Business Knowledge","number":21,"title":"ケースで学ぶ 財務分析力ブラッシュアップ研修 vol.1","summary":"決算情報をもとに自社や他社の状況を把握する力は、様々な場面で求められます。\n本研修は、決算書の基本的な見方を身につけている方を対象に、決算書を読む力をさらに向上させることを目的とした研修です。決算書のどの部分に着目すればよいのか、財務分析指標を活用してどのように読み解くのかを、実在する企業の決算書を使って学んでいただきます。\n*「【初級】経営数字」「【中級】経営数字」を受講された方を対象とした研修です\n*本研修では電卓をご用意ください","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/346ZTllYHyVm3dJqBk63/","online":false,"sessi :"日本では、年間約1万社の企業が倒産しています。取引先企業が倒産すると、自社の売り上げが減少するだけでなく、貸倒損失による利益の減少や資金繰りの悪化など、様々な影響を受けます。\n本研修では、取引先が倒産し回収不能とならないよう、その予兆を発見するための考え方と手法をお伝えします。なお、本研修は国内のBtoB（法人取引）を想定しています。海外取引は内容に含まれませんのでご留意ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/37ojnKtOcufUk6N4Pq9Q/","online":false,"sessions":[{"date":"2026-12-08","weekday":"火","start":"16:30","end":"18:30","part":""},{"date":"2027-03-12","weekday":"金","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-12-08","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-25","category":"ビジネス知識","categoryKey":"Business Knowledge","number":25,"title":"標準化の進め方の基本","summary":"「仕事のノウハウが属人化しており、将来的に不安がある」「仕事の質にバラつきがあり、業務の効率が著しく悪い」。業務の進め方をそろえる「標準化」は、このような悩みを解決するために非常に有用な施策です。\n本研修では、「標準化」を推進する役割を担う方を対象に、標準化の基本的な手順をお伝えします。標準化の全体像や標準化を進める際の注意点などを学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/38MBTH62SN462f9Nhd1m/","online":false,"sessions":[{"date":"2026-11-09","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2026-12-14","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2027-02-22","weekday":"月","start":"16:00","end":"18:00","part":""},{"date":"2027-03-18","weekday":"木","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-11-09","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["管理職"]},{"id":"Business Knowledge-26","category":"ビジネス知識","categoryKey":"Business Knowledge","number":26,"title":"【公開型ライブオンライン研修】標準化の進め方の基本","summary":"「仕事のノウハウが属人化しており、将来的に不安がある」「仕事の質にバラつきがあり、業務の効率が著しく悪い」。業務の進め方をそろえる「標準化」は、このような悩みを解決するために非常に有用な施策です。\n本研修では、「標準化」を推進する役割を担う方を対象に、標準化の基本的な手順をお伝えします。標準化の全体像や標準化を進める際の注意点などを学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/38MBTH62SN462f9Nhd1m/","online":true,"sessions":[{"date":"2026-10-13","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2026-11-06","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2026-11-20","weekday":"金","start":"16:00","end":"18:00","part":""},{"date":"2026-12-24","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-01-25","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2027-02-24","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-03-16","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-03-26","weekday":"金","start":"16:00","end":"18:00","part":""}],"firstDate":"2026-10-13","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["管理職"]},{"id":"Business Knowledge-27","category":"ビジネス知識","categoryKey":"Business Knowledge","number":27,"title":"マニュアル作成の基本＜作成する際の考え方＞","summary":"マニュアルは作成するだけでは意味がありません。活用されてはじめて効果を発揮するものですが、様々なシーンで作成されていながら、活用されていないケースが見られます。\n本研修では、「どうやったら活用されるマニュアルが作れるのか」に焦点を当て、その方法をお伝えします。\n*マニュアルを作成する実務担当者を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/38TMCp4i1ez7Kfg6x4xh/","online":false,"sessions":[{"date":"2026-10-29","weekday":"木","start":"10:00","end":"12:30","part":""},{"date":"2026-11-24","weekday":"火","start":"10:00","end":"12:30","part":""},{"date":"2026-12-23","weekday":"水","start":"14:00","end":"16:30","part":""},{"date":"2027-01-29","weekday":"金","start":"10:00","end":"12:30","part":""},{"date":"2027-02-17","weekday":"水","start":"14:00","end":"16:30","part":""},{"date":"2027-03-16","weekday":"火","start":"10:00","end":"12:30","part":""}],"firstDate":"2026-10-29","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-28","category":"ビジネス知識","categoryKey":"Business Knowledge","number":28,"title":"はじめてのヒューマンエラー","summary":"厳しい管理をしているのに、同じようなミスが繰り返し起きてしまう…。こんなお悩みはありませんか？\n本研修では、人間の特性に基づいたヒューマンエラーが発生する原因を理解し、その対策を講じるための基本的な考え方をお伝えします。クレーム・不良・ミスなど職場のトラブル削減に取り組んでいる方は、その要因の一つである「ヒューマンエラー」を知る第一歩として本研修にご参加ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3B4sH2C3IZib3GLxMpy6/","online":false,"sessions":[{"date":"2026-10-20","weekday":"火","start":"10:00","end":"12:30","part":""},{"date":"2026-11-19","weekday":"木","start":"14:00","end":"16:30","part":""},{"date":"2026-12-18","weekday":"金","start":"10:00","end":"12:30","part":""},{"date":"2027-01-22","weekday":"金","start":"14:00","end":"16:30","part":""},{"date":"2027-02-24","weekday":"水","start":"14:00","end":"16:30","part":""},{"date":"2027-03-10","weekday":"水","start":"10:00","end":"12:30","part":""}],"firstDate":"2026-10-20","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-29","category":"ビジネス知識","categoryKey":"Business Knowledge","number":29,"title":"［若手向け］リスク感度の高め方","summary":"近年、企業経営におけるリスク管理を重要課題と位置づけ、取り組みを強化する企業が増えています。「会社のリスク管理は、経営者や内部監査部門がすることで、若手の自分には関係ない」と思っていませんか。ビジネスにおけるリスクは至る所に潜んでいるため、1人の些細な行動が、自身の業務だけでなく会社の経営に大きな打撃を与える可能性があります。\n本研修は、若手社員を対象に、リスクに関して正しく理解していただくことを目的とした研修です。ケーススタディを通じて、リスク感度を高めるポイントを学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3B618kF3jR2Jq6RP9R6U/","online":false,"sessions":[{"date":"2026-11-13","weekday":"金","start":"09:00","end":"11:00","part":""},{"date":"2027-01-25","weekday":"月","start":"13:30","end":"15:30","part":""},{"date":"2027-02-18","weekday":"木","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-11-13","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-30","category":"ビジネス知識","categoryKey":"Business Knowledge","number":30,"title":"クレーム電話対応","summary":"クレームとは、顧客からの要望や改善要求などを指します。しかし、良いクレームばかりが来るとは限らず、中には、こちらがいくら謝意を示しても、相手の怒りが収まらない場合もあります。また、対応を誤ると、会社に甚大な損害をもたらしたり、風評被害を引き起こしたりするリスクが高まります。\n本研修では、クレームの初期対応となる電話対応について、その基本的なポイントをご紹介します。クレームの電話を受けた際、どのように対処すべきかお悩みの方は、ぜひご参加ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3BYH7FrdR696uz1JiU97/","online":false,"sessions":[{"date":"2026-11-18","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-02-25","weekday":"木","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-11-18","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-31","category":"ビジネス知識","categoryKey":"Business Knowledge","number":31,"title":"［若手向け］基礎人事実務","summary":"人事部門の仕事は多岐にわたるため、人事になじみの薄い方にとっては全体像をつかみにくい仕事です。\n本研修では、これから人事を担当する方や人事担当になって間もない方を対象に、人事の役割や基本的な姿勢、業務を進めるうえでのポイントをお伝えします。労働保険の年度更新、社会保険の定時決定、給与計算など、人事業務で必要となる手続きの基礎知識についても解説します。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3CuzcnRc865J5yOWuhyI/","online":false,"sessions":[{"date":"2026-12-17","weekday":"木","start":"13:30","end":"15:30","part":""},{"date":"2027-02-09","weekday":"火","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-12-17","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-32","category":"ビジネス知識","categoryKey":"Business Knowledge","number":32,"title":"契約書の見方・作り方の基本","summary":"日常業務の中で頻繁に目にする契約書ですが、その内容をきちんと理解したうえで業務を進めている人は意外と少ないのではないでしょうか。契約内容をきちんと確認せずに取引を進めてしまうと、思わぬところで自社に不利益を及ぼす危険性があります。\n本研修では、ビジネスにおける契約の意義を明確にし、契約書作成時やチェック時に確認すべきポイントなどを、事例をもとに解説します。なお、本研修には法律の個別解説、法律相談などは含まれておりませんので、ご了承のうえご参加ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3EJLI96xT1PrvJJy7463/","online":false,"sessions":[{"date":"2026-12-02","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2027-02-08","weekday":"月","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-12-02","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-33","category":"ビジネス知識","categoryKey":"Business Knowledge","number":33,"title":"［事務部門向け］経費削減のコツ","summary":"経費削減は、企業が利益を上げるために必要な重点施策の一つです。\n本研修では、事務部門で経費削減に取り組んでいる、もしくはこれから取り組む予定の方を対象に、経費削減のコツをお伝えします。多くの会社が実施している定番の手法のほか、自社の課題を発見するための経費削減の推進手順も紹介します。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3Ebt1GwMJ11c6f7c7mYK/","online":false,"sessions":[{"date":"2026-11-06","weekday":"金","start":"09:00","end":"11:00","part":""},{"date":"2027-02-19","weekday":"金","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-11-06","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-34","category":"ビジネス知識","categoryKey":"Business Knowledge","number":34,"title":"【基礎】経理実務","summary":"「経理業務に携わっているが、業務の全体像がわからない」「仕訳の考え方を理解できないまま業務を行っている」。こういったお悩みをお持ちではないでしょうか。\n本研修では、経理業務に携わって間もない方、これから経理業務に携わる方を対象に、経理業務の全体像や決算書の概要、基本的な仕訳の考え方といった経理業務の基本をお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3Fk9LZsSxEGD4iOK9e9p/","online":false,"sessions":[{"date":"2026-11-16","weekday":"月","start":"09:00","end":"11:00","part":""},{"date":"2027-03-10","weekday":"水","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-11-16","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-35","category":"ビジネス知識","categoryKey":"Business Knowledge","number":35,"title":"マーケティングの基本","summary":"マーケティングは頻繁に耳にする用語ですが、その意味と活動内容を正確に理解している方は意外と少ないのではないでしょうか。マーケティングとは、「市場調査」や「販売促進」といった狭い意味ではなく、企業活動の根幹を成すものです。\n本研修は、これからマーケティングに携わる方を対象とした研修です。マーケティングを「売れる商品と売れる仕組みをつくること」と定義し、「セグメンテーション」「ターゲティング」「ポジショニング」、そして4P（製品、価格、流通チャネル、広告宣伝）のポイントをご紹介します。また、ワークを通じてマーケティング思考を体感していただきます。自社商品・サービスをマーケティング観点で振り返るきっかけにしてください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3Fwk4BR6Zf3El2x872bH/","online":false,"sessions":[{"date":"2026-11-05","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2027-03-30","weekday":"火","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-11-05","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-36","category":"ビジネス知識","categoryKey":"Business Knowledge","number":36,"title":"初心者のためのWebマーケティング","summary":"「Webマーケティング」という言葉は知っているが、具体的に何をしたらいいのかわからない、また、効果的な施策を知りたいといったお悩みはありませんか。\n本研修では、新しくWebマーケティングを担当することになった方を対象に、Webサイト中心のプロモーション活動を行う際に知っておくべき基本的な流れや施策をお伝えします。Webマーケティングの基本用語や基本施策、効果測定について学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3Hudf996nv96Legvwg1O/","online":false,"sessions":[{"date":"2026-12-22","weekday":"火","start":"13:30","end":"15:30","part":""},{"date":"2027-02-26","weekday":"金","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-12-22","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-37","category":"ビジネス知識","categoryKey":"Business Knowledge","number":37,"title":"初心者のためのPR・広報","summary":"広報・PRは、お客さまとの直接のコミュニケーションではなく、広く「世間」と対話することで自社の魅力を伝える役割を担っています。\n本研修では、新しく広報・PRを担当することになった方を対象に、広報・PRに求められる役割から実務におけるポイントまでをお伝えします。明日からの実践につながるヒントをお持ち帰りいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3JXvuTld43JrY98Nlz1C/","online":false,"sessions":[{"date":"2026-12-23","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2027-03-26","weekday":"金","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-12-23","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-38","category":"ビジネス知識","categoryKey":"Business Knowledge","number":38,"title":"【公開型ライブオンライン研修】初心者のためのPR・広報","summary":"広報・PRは、お客さまとの直接のコミュニケーションではなく、広く「世間」と対話することで自社の魅力を伝える役割を担っています。\n本研修では、新しく広報・PRを担当することになった方を対象に、広報・PRに求められる役割から実務におけるポイントまでをお伝えします。明日からの実践につながるヒントをお持ち帰りいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3JXvuTld43JrY98Nlz1C/","online":true,"sessions":[{"date":"2026-11-24","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2027-03-29","weekday":"月","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-11-24","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-39","category":"ビジネス知識","categoryKey":"Business Knowledge","number":39,"title":"営業事務の基本","summary":"営業事務は、単に事務処理をこなす仕事ではありません。お問い合わせ対応、クレーム対応など、会社の顔として様々な場面でお客さまとのやりとりを行います。一方で、会社の売り上げを担う営業担当者の良きビジネスパートナーとして、時には助言し、時には厳しく接することも必要でしょう。\n本研修では、営業事務業務に携わる方を対象に、営業事務に求められる心構えと具体的なスキルについてお伝えします。他社の参加者とのワークを通じて、営業事務の業務に対する理解を深めていただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3MXhk8udLefBsMSSEUV8/","online":false,"sessions":[{"date":"2026-12-11","weekday":"金","start":"10:00","end":"12:30","part":""},{"date":"2027-03-10","weekday":"水","start":"14:00","end":"16:30","part":""}],"firstDate":"2026-12-11","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手","新人"]},{"id":"Business Knowledge-40","category":"ビジネス知識","categoryKey":"Business Knowledge","number":40,"title":"【公開型ライブオンライン研修】営業事務の基本","summary":"営業事務は、単に事務処理をこなす仕事ではありません。お問い合わせ対応、クレーム対応など、会社の顔として様々な場面でお客さまとのやりとりを行います。一方で、会社の売り上げを担う営業担当者の良きビジネスパートナーとして、時には助言し、時には厳しく接することも必要でしょう。\n本研修では、営業事務業務に携わる方を対象に、営業事務に求められる心構えと具体的なスキルについてお伝えします。他社の参加者とのワークを通じて、営業事務の業務に対する理解を深めていただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3MXhk8udLefBsMSSEUV8/","online":true,"sessions":[{"date":"2026-11-16","weekday":"月","start":"09:30","end":"12:00","part":""},{"date":"2027-03-19","weekday":"金","start":"09:30","end":"12:00","part":""}],"firstDate":"2026-11-16","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手","新人"]},{"id":"Business Knowledge-41","category":"ビジネス知識","categoryKey":"Business Knowledge","number":41,"title":"［法人営業向け］新規開拓営業のコツ＜電話アポ&飛び込み編＞","summary":"ビジネス環境が激変する昨今、成果を出して成長し続けるには、より多くの新規顧客を獲得していくことが不可欠です。\n本研修では、法人向け新規開拓営業に携わる方を対象に、「電話アポ・飛び込み」に焦点を当て、新規顧客獲得のコツをお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3O116v6xG26cbGgXN74N/","online":false,"sessions":[{"date":"2026-10-19","weekday":"月","start":"13:30","end":"15:30","part":""},{"date":"2027-01-14","weekday":"木","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-10-19","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-42","category":"ビジネス知識","categoryKey":"Business Knowledge","number":42,"title":"［法人営業向け］新規開拓営業のコツ＜商談準備編＞","summary":"新規開拓営業の商談を成功させるには、訪問先の企業情報を深く理解し、自社の商品・サービスを魅力的に伝えるためのストーリーを設計しなければなりません。加えて、先方からの質問を予想し、それに対するカウンタートークを考えるなど、様々な準備が必要です。\n本研修では、法人向け新規開拓営業に携わる方を対象に、商談の質を上げるための「訪問前準備」に焦点を当て、そのポイントやノウハウをお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3QnvuG9K8DEV68IPJEWP/","online":false,"sessions":[{"date":"2026-12-18","weekday":"金","start":"09:00","end":"11:00","part":""},{"date":"2027-02-09","weekday":"火","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-12-18","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-43","category":"ビジネス知識","categoryKey":"Business Knowledge","number":43,"title":"［法人営業向け］新規開拓営業のコツ＜案件フォロー・クロージング編＞","summary":"新規開拓営業で成果を上げるためには、一度接点を持った案件を適切なタイミングでフォローし、契約までのステップをスムーズに進めていく必要があります。適切なフォローができていなければ、「お客さまの背中を押す」役割を担うはずのクロージングも、ただの押し売りになってしまいます。\n本研修は、法人向け新規開拓営業に携わる方を対象に、案件フォローやクロージングについて学んでいく研修です。一度接点を持った案件をいかに契約まで導くのか、そのポイントやノウハウをお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3RYQP2lyBlgHjx6VlrNB/","online":false,"sessions":[{"date":"2026-12-14","weekday":"月","start":"09:00","end":"11:00","part":""},{"date":"2027-03-03","weekday":"水","start":"16:30","end":"18:30","part":""}],"firstDate":"2026-12-14","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-44","category":"ビジネス知識","categoryKey":"Business Knowledge","number":44,"title":"［法人営業向け］新規開拓営業のコツ＜紹介・リピート編＞","summary":"新規開拓営業で難しいのは、見込み客を増やすことです。トップセールスといわれる人たちは、既存顧客からの紹介やリピートで効率的に見込み客を増やしています。\n本研修では、法人向け新規開拓営業に携わる方を対象に、既存顧客からの紹介やリピートで見込み客を獲得するポイントを学びます。紹介してもらうために個人・組織としてやるべきことや、リピート受注を得るためのコツをお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3dfV6XXB65jmqtm7557w/","online":false,"sessions":[{"date":"2026-12-03","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2027-03-19","weekday":"金","start":"16:30","end":"18:30","part":""}],"firstDate":"2026-12-03","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-45","category":"ビジネス知識","categoryKey":"Business Knowledge","number":45,"title":"［法人営業向け］新規開拓営業のコツ＜管理職のための営業管理編＞","summary":"新規開拓営業の成果を継続的に上げていくためには、飛び込み、電話アポ、商談、クロージングなど、営業の各工程に求められるスキルを高めるだけでなく、営業組織としてPDCAを廻す必要もあります。\n本研修では、法人向け新規開拓営業の管理を行う管理職の方を対象に、営業管理のポイントをお伝えします。営業組織を管理するうえで必要な考え方や、具体的な行動、使うべきツールもご紹介します。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3eD9R3l4R4mr9N19rDoH/","online":false,"sessions":[{"date":"2026-12-10","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2027-03-16","weekday":"火","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-12-10","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["管理職","中堅・ベテラン"]},{"id":"Business Knowledge-46","category":"ビジネス知識","categoryKey":"Business Knowledge","number":46,"title":"［法人営業向け］提案型営業のコツ","summary":"今の時代に求められる営業スタイルは、いらないものを売りつける“押し売り営業”や、言われたことしかしない“御用聞き営業”ではなく、顧客の課題解決をお手伝いする“提案型営業”です。では、提案型営業を通じてお客さまの真のパートナーとなるために必要なこととは何でしょうか。\n本研修では、法人向け提案型営業に携わる方を対象に、提案型営業で成果を上げるポイントをお伝えします。お客さまの本質的な課題を把握し、課題の解決策を提案するための勘所をつかんでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3k1tk97LUfg72y4y8kq1/","online":false,"sessions":[{"date":"2026-12-08","weekday":"火","start":"14:00","end":"16:30","part":""},{"date":"2027-03-09","weekday":"火","start":"14:00","end":"16:30","part":""}],"firstDate":"2026-12-08","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-47","category":"ビジネス知識","categoryKey":"Business Knowledge","number":47,"title":"［小売業・サービス業向け］店長リーダーシップ研修","summary":"店長の仕事とは何でしょうか。店長とはいわば「ミニ経営者」であり、店舗を「経営」する力が求められます。多岐にわたる業務の中で、確実に売り上げを伸ばしていくには、リーダーシップを発揮するポイントをおさえ、それを実践していかなければなりません。\n本研修では、店長や副店長の方、これから店長を任される方を対象に、店舗のビジョン策定と浸透、顧客満足の向上、売上施策、メンバーの育成について、ディスカッションを通じて実践のポイントを学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3nRsI3KJ69zs93h2DZ6r/","online":false,"sessions":[{"date":"2026-12-24","weekday":"木","start":"10:00","end":"17:00","part":""},{"date":"2027-03-18","weekday":"木","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-12-24","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["管理職"]},{"id":"Business Knowledge-48","category":"ビジネス知識","categoryKey":"Business Knowledge","number":48,"title":"［小売業・サービス業向け］販売員ベーシックスキル研修","summary":"販売員の印象は、店舗の売り上げを左右する非常に重要な要素です。そのため、販売員の仕事は重要であると同時に、やりがいのある仕事でもあるといえるのではないでしょうか。しかし、販売員に求められる役割やスキルを理解していなければ、販売員という仕事の奥深さを感じることはできません。\n本研修では、販売員になって間もない方、これから販売員として働く方向けに、販売員としての心構えや店舗の売り上げアップのために身につけておくべきスキルをお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3p7fO47j31x2VL541w1I/","online":false,"sessions":[{"date":"2026-12-16","weekday":"水","start":"10:00","end":"12:30","part":""},{"date":"2027-03-11","weekday":"木","start":"10:00","end":"12:30","part":""}],"firstDate":"2026-12-16","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手","新人"]},{"id":"Business Knowledge-49","category":"ビジネス知識","categoryKey":"Business Knowledge","number":49,"title":"［小売業向け］売り場作りの基本","summary":"小売業において、売り場とはお客さまとのコミュニケーションの場です。その「場」の演出方法次第で、店舗の売り上げは大きく変わります。今や店舗にとって、「売り上げが上がる売り場作り」を追求することは、欠かすことのできない重要な業務であるといえるでしょう。\n本研修では、小売業の方を対象に、売り場のレイアウトや商品陳列、色使い、POPの書き方など、売り上げが伸びる売り場作りの基本知識を学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3p9j5623T65M4m31GC9h/","online":false,"sessions":[{"date":"2026-11-24","weekday":"火","start":"16:30","end":"18:30","part":""},{"date":"2027-03-18","weekday":"木","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-11-24","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-50","category":"ビジネス知識","categoryKey":"Business Knowledge","number":50,"title":"［製造業・商社向け］はじめての在庫管理","summary":"在庫管理は、現物の安定供給や過剰在庫の防止に欠かせない業務です。\n本研修では、製造業・商社ではじめて在庫管理に携わる方を対象に、在庫管理の一般的な流れをお伝えします。適切な入出庫、在庫量の正確な把握、適正在庫量の設定、在庫の削減について、基本的なポイントをおさえていただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3sDjeV8i3fVPW29SOgry/","online":false,"sessions":[{"date":"2026-12-09","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-03-26","weekday":"金","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-12-09","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-51","category":"ビジネス知識","categoryKey":"Business Knowledge","number":51,"title":"［製造業・商社向け］はじめての購買管理","summary":"購買管理では、仕入先から良いものを安く、発注通りに仕入れてもらえるように管理することが重要です。\n本研修では、製造業・商社ではじめて購買管理に携わる方を対象に、購買管理の一般的な流れをお伝えします。新規仕入先の選定、発注管理、納期管理について、基本的なポイントをおさえていただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3tIcjJ4vbEnBNY76QWJl/","online":false,"sessions":[{"date":"2026-12-08","weekday":"火","start":"09:00","end":"11:00","part":""},{"date":"2027-03-11","weekday":"木","start":"16:30","end":"18:00","part":""}],"firstDate":"2026-12-08","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-52","category":"ビジネス知識","categoryKey":"Business Knowledge","number":52,"title":"［製造業向け］はじめての生産管理＜生産計画編＞","summary":"製造コストの低減や製品の安定供給には、適切な生産管理が不可欠です。\n本研修では、製造業ではじめて生産管理に携わる方を対象に、生産管理の概要や必要性などをお伝えします。そのうえで、生産計画作成の基本的なポイントを学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3u7146DBd8qiycv2985i/","online":false,"sessions":[{"date":"2026-12-17","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2027-03-19","weekday":"金","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-12-17","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-53","category":"ビジネス知識","categoryKey":"Business Knowledge","number":53,"title":"［製造業向け］はじめての原価管理","summary":"適切な原価管理は、原価の低減や維持、見積原価計算の精度向上など、様々なメリットをもたらします。\n本研修では、製造業ではじめて原価管理に携わる方を対象に、原価管理の概要、原価計算の基本的な考え方をお伝えし、原価低減を推進するための基本的なポイントを学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3vCk4P4ednHM7iRgIqI3/","online":false,"sessions":[{"date":"2026-11-05","weekday":"木","start":"13:30","end":"15:30","part":""},{"date":"2027-03-12","weekday":"金","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-11-05","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-54","category":"ビジネス知識","categoryKey":"Business Knowledge","number":54,"title":"［製造業向け］はじめての品質管理","summary":"品質管理のゴールの一つに、不良品の削減・撲滅があります。\n本研修では、製造業ではじめて品質管理に携わる方を対象に、品質管理の概要をお伝えします。不良品発生時の対応方法や原因分析のポイントなどについて、ワークを通じて理解を深めていただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3wc8RpXC2vz3xx66mL5Z/","online":false,"sessions":[{"date":"2026-12-22","weekday":"火","start":"09:00","end":"11:00","part":""},{"date":"2027-03-25","weekday":"木","start":"16:30","end":"18:30","part":""}],"firstDate":"2026-12-22","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-55","category":"ビジネス知識","categoryKey":"Business Knowledge","number":55,"title":"［製造業向け］5S（整理・整頓・清掃・清潔・しつけ）の基本","summary":"生産性向上への取り組みが盛んに行われている昨今、「5S」への注目度が高まっています。\n本研修では、製造業ではじめて5Sに取り組む方を対象に、製造業での事例を中心に5Sの基本をお伝えします。5Sとは何か、何のために行うのか、どのように実施するのかなどを学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/3yiRw39G86H5oVu3KSq3/","online":false,"sessions":[{"date":"2026-10-28","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-01-14","weekday":"木","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-10-28","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["若手"]},{"id":"Business Knowledge-56","category":"ビジネス知識","categoryKey":"Business Knowledge","number":56,"title":"［IT業向け］はじめてのプロジェクト管理シリーズ＜入門編＞","summary":"「プロジェクト管理を任されたが、何をすればいいのかわからない」「自分が行っているプロジェクト管理の方法は正しいのかわからない」。プロジェクト管理の経験が少ない方にとって、一度はぶつかったことがあるお悩みではないでしょうか。\n本研修では、IT業ではじめてプロジェクト管理に携わる方を対象に、プロジェクト管理の全体像と勘所をお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4193Y8Ht7oo21D5O11OY/","online":false,"sessions":[{"date":"2026-10-23","weekday":"金","start":"14:00","end":"16:30","part":""},{"date":"2026-11-19","weekday":"木","start":"10:00","end":"12:30","part":""},{"date":"2027-01-22","weekday":"金","start":"10:00","end":"12:30","part":""},{"date":"2027-03-11","weekday":"木","start":"14:00","end":"16:30","part":""}],"firstDate":"2026-10-23","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-57","category":"ビジネス知識","categoryKey":"Business Knowledge","number":57,"title":"［IT業向け］はじめてのプロジェクト管理シリーズ＜WBS作成編＞","summary":"求められた品質、コスト、納期通りにプロジェクトを完遂するためには、精緻なプロジェクト計画の立案が不可欠です。そのプロジェクト計画のコアとなる成果物が「WBS」です。今では当たり前のように作られるWBSですが、その作り方や使い方について学んでいる方はそれほど多くありません。\n本研修では、IT業ではじめてプロジェクト管理に携わる方を対象に、WBSの重要性やWBSを作成するポイントなどを、ワークを通じて学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4216364gz7HGk37jbdCs/","online":false,"sessions":[{"date":"2026-10-09","weekday":"金","start":"10:00","end":"12:30","part":""},{"date":"2026-12-08","weekday":"火","start":"10:00","end":"12:30","part":""},{"date":"2027-01-26","weekday":"火","start":"14:00","end":"16:30","part":""},{"date":"2027-03-02","weekday":"火","start":"10:00","end":"12:30","part":""}],"firstDate":"2026-10-09","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-58","category":"ビジネス知識","categoryKey":"Business Knowledge","number":58,"title":"［IT業向け］はじめてのプロジェクト管理シリーズ＜進捗管理編＞","summary":"「プロジェクトが終盤に差し掛かると、進捗率95%のタスクがあふれ、プロジェクトがどのような状況にあるかわからなくなる」「メンバーからの進捗報告が曖昧で信用できない」。こんな経験はありませんか。日々当たり前のように行われている進捗管理ですが、適切に進捗を把握して対策を打つためには、様々なポイントをおさえておく必要があります。\n本研修では、IT業ではじめてプロジェクト管理に携わる方を対象に、プロジェクトを納期通りに終わらせるための進捗管理のポイントを、ワークを通じて学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/43O1F1n5qbUobxB4p95E/","online":false,"sessions":[{"date":"2026-10-27","weekday":"火","start":"10:00","end":"12:30","part":""},{"date":"2026-12-07","weekday":"月","start":"10:00","end":"12:30","part":""},{"date":"2027-01-18","weekday":"月","start":"10:00","end":"12:30","part":""},{"date":"2027-03-05","weekday":"金","start":"14:00","end":"16:30","part":""}],"firstDate":"2026-10-27","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-59","category":"ビジネス知識","categoryKey":"Business Knowledge","number":59,"title":"［IT業向け］はじめてのプロジェクト管理シリーズ＜品質管理編＞","summary":"「品質管理を実施してください」。こう言われたら、何を行えばよいのでしょうか。設計書のレビュー、プログラムのテスト…それだけでしょうか。「品質管理とは何をすることか」の説明は意外と難しいものです。\n本研修では、IT業ではじめてプロジェクト管理に携わる方を対象に、品質管理の基本を、初心者にも理解できるようわかりやすく解説します。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/43hs7g5H5K8xF16115if/","online":false,"sessions":[{"date":"2026-12-02","weekday":"水","start":"14:00","end":"16:30","part":""},{"date":"2027-02-19","weekday":"金","start":"10:00","end":"12:30","part":""}],"firstDate":"2026-12-02","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Business Knowledge-60","category":"ビジネス知識","categoryKey":"Business Knowledge","number":60,"title":"［IT業向け］はじめてのプロジェクト管理シリーズ＜リスク管理編＞","summary":"システム開発プロジェクトには様々なリスクが存在し、それらがプロジェクトの失敗を招いてしまうケースもあります。どれだけ精緻な計画を立案したとしても、リスクを特定し適切に管理しなければ、プロジェクトの成功は見込めません。\n本研修では、IT業ではじめてプロジェクト管理に携わる方を対象に、「プロジェクトに潜むリスクとは何か」「リスクを管理するための手順やポイントは何か」を、ワークを通じて学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/444N8Uc193RG5hHguIvb/","online":false,"sessions":[{"date":"2026-12-14","weekday":"月","start":"14:00","end":"16:30","part":""},{"date":"2027-03-08","weekday":"月","start":"10:00","end":"12:30","part":""}],"firstDate":"2026-12-14","relatedThemeKey":"Business Knowledge","relatedTheme":"ビジネス知識","targets":["中堅・ベテラン"]},{"id":"Self-Management-1","category":"セルフマネジメント","categoryKey":"Self-Management","number":1,"title":"新任管理職研修","summary":"管理職に就任し、どのような変化がありましたか？\nまた今後どのように成果を出していきたいですか？\n管理職とメンバーでは、求められる役割が大きく異なります。\n高い成果を出すには、まず役割の違いを踏まえ、\nその上で必要な視点やスキルを身につけることが重要です。\n本研修では、管理職に求められる役割に焦点を当て、\n方針伝達やマネジメント、部門間調整や自己統制の要諦をお伝えします。\n*管理職に就任して2年以内の方を対象とした研修です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/459K2467Q9E1PqSH69e7/","online":false,"sessions":[{"date":"2026-10-21","weekday":"水","start":"10:00","end":"17:00","part":""},{"date":"2026-11-13","weekday":"金","start":"10:00","end":"17:00","part":""},{"date":"2027-01-15","weekday":"金","start":"10:00","end":"17:00","part":""},{"date":"2027-02-12","weekday":"金","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-10-21","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["管理職"]},{"id":"Self-Management-2","category":"セルフマネジメント","categoryKey":"Self-Management","number":2,"title":"ストーリーで学ぶ ビジネスリーダー研修＜リーダーとしてのセルフマネジメント編＞","summary":"人の上に立つリーダーの立ち居振る舞いは、組織に対して大きな影響力を持ちます。そのため、組織が成果を出し、成長していくためには、リーダーが自分自身を適切にマネジメントできなければなりません。\n本研修では、あるビジネスリーダーの行動をまとめた小説形式のストーリーを読み進めながら、リーダーとして自身の時間や感情、振る舞いをマネジメントできているかを振り返ります。他社の参加者とのディスカッションを通じ、今後取り組むべきことや課題について考えます。\n*「ストーリーで学ぶビジネスリーダー研修」シリーズは各回完結型です。受講順序はありません","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/47JzctnnhQLnNsFT1QDt/","online":false,"sessions":[{"date":"2026-12-17","weekday":"木","start":"10:00","end":"17:00","part":""},{"date":"2027-01-21","weekday":"木","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-12-17","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["管理職"]},{"id":"Self-Management-3","category":"セルフマネジメント","categoryKey":"Self-Management","number":3,"title":"【公開型ライブオンライン研修】ストーリーで学ぶ ビジネスリーダー研修＜リーダーとしてのセルフマネジメント編＞","summary":"人の上に立つリーダーの立ち居振る舞いは、組織に対して大きな影響力を持ちます。そのため、組織が成果を出し、成長していくためには、リーダーが自分自身を適切にマネジメントできなければなりません。\n本研修では、あるビジネスリーダーの行動をまとめた小説形式のストーリーを読み進めながら、リーダーとして自身の時間や感情、振る舞いをマネジメントできているかを振り返ります。他社の参加者とのディスカッションを通じ、今後取り組むべきことや課題について考えます。\n*「ストーリーで学ぶビジネスリーダー研修」シリーズは各回完結型です。受講順序はありません","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/47JzctnnhQLnNsFT1QDt/","online":true,"sessions":[{"date":"2026-11-12","weekday":"木","start":"09:30","end":"16:30","part":""},{"date":"2027-02-17","weekday":"水","start":"09:30","end":"16:30","part":""}],"firstDate":"2026-11-12","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["管理職"]},{"id":"Self-Management-4","category":"セルフマネジメント","categoryKey":"Self-Management","number":4,"title":"ハイパフォーマーが実践するセルフマネジメント研修","summary":"「高い営業目標、短納期でのプロジェクト敢行、急な資料作成依頼による残業…。日々業務に追われ、遅い時間まで会社に残って頑張っているのに結果につながらない」。このような状態になっていないでしょうか？仕事に限ったことではありませんが、その人のパフォーマンスは、マインド・感情の状態に大きく左右されます。\n本研修は、ハイパフォーマーの姿勢に学びながら、自らが望む高い成果を得るために何が必要なのかを考える研修です。自分自身の行動習慣をワークを通じて振り返り、今後の行動に変革を起こす機会として、ぜひ本研修をご活用ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4Gq5bL8si7c1jMLt58p3/","online":false,"sessions":[{"date":"2026-12-01","weekday":"火","start":"10:00","end":"17:00","part":""},{"date":"2027-01-14","weekday":"木","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-12-01","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["中堅・ベテラン"]},{"id":"Self-Management-5","category":"セルフマネジメント","categoryKey":"Self-Management","number":5,"title":"周囲への影響を考えるセルフリーダーシップ","summary":"仕事を適切に進めるためには、「できないことを環境のせいにする」のではなく、「自分自身を変えることで、周囲の環境に良い影響を与える」必要があります。\n本研修では、中堅社員を対象に、仕事を適切に進めていくうえでの「自分のあるべき姿」を、自分視点と他者視点の2つの軸で考えていきます。そして、あるべき姿になるための行動（＝セルフリーダーシップ）について、ケーススタディを通じて学んでいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4JhX53NRH51FVJyns6n3/","online":false,"sessions":[{"date":"2026-10-06","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2026-10-23","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2026-11-04","weekday":"水","start":"10:00","end":"12:00","part":""},{"date":"2026-11-19","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2026-12-01","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2026-12-07","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2026-12-25","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2027-01-19","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2027-02-15","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2027-02-24","weekday":"水","start":"16:00","end":"18:00","part":""},{"date":"2027-03-05","weekday":"金","start":"16:00","end":"18:00","part":""}],"firstDate":"2026-10-06","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["中堅・ベテラン"]},{"id":"Self-Management-6","category":"セルフマネジメント","categoryKey":"Self-Management","number":6,"title":"エモーショナルマネジメントの基本","summary":"本研修では、EQ（Emotional Intelligence Quotient）の思想に基づいた自分自身の感情をマネジメントする方法について学びます。\n人間の思考や行動は感情から始まると言われています。\n仕事で安定的に高いパフォーマンスを発揮するためには、仕事を進めるスキルを身につけるだけでなく自分自身の感情もコントロールできるようになることが重要です。\n研修ではEQの思想を紹介しつつ、自分自身の感情をコントロールできるようになるためのポイントをお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4Mv4NX89FNTf71p2Ky32/","online":false,"sessions":[{"date":"2026-10-16","weekday":"金","start":"16:00","end":"18:00","part":""},{"date":"2026-10-29","weekday":"木","start":"10:00","end":"12:00","part":""},{"date":"2026-11-13","weekday":"金","start":"10:00","end":"12:00","part":""},{"date":"2026-11-25","weekday":"水","start":"16:00","end":"18:00","part":""},{"date":"2026-12-08","weekday":"火","start":"10:00","end":"12:00","part":""},{"date":"2026-12-22","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-01-20","weekday":"水","start":"13:00","end":"15:00","part":""},{"date":"2027-02-22","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2027-03-05","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-03-23","weekday":"火","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-10-16","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["中堅・ベテラン"]},{"id":"Self-Management-7","category":"セルフマネジメント","categoryKey":"Self-Management","number":7,"title":"ここからはじめる健康管理","summary":"近年、社員の健康状態が会社の業績に影響を与えることが知られるようになり、企業経営において、社員の健康維持が重要な課題となっています。そのため、ビジネスパーソンとして求められる役割を果たし、成果を出し続けるには、自身の健康を維持することが不可欠です。\n本研修は、なかなか自身の健康維持に取り組めない方、健康維持のために意識すべきことを知りたい方を対象とした健康管理の入門研修です。仕事をしながら自身の健康を管理するための基本的なポイントを学んでいただきます。\n*心の健康に関しては、「［管理職向け］労務管理研修＜メンタルへルスの基礎知識編＞」をご受講ください","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4Pfiwr6My261rB7V9315/","online":false,"sessions":[{"date":"2026-11-20","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2026-12-07","weekday":"月","start":"09:30","end":"11:30","part":""},{"date":"2027-01-22","weekday":"金","start":"13:00","end":"15:00","part":""},{"date":"2027-02-18","weekday":"木","start":"13:00","end":"15:00","part":""},{"date":"2027-03-18","weekday":"木","start":"09:30","end":"11:30","part":""}],"firstDate":"2026-11-20","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["中堅・ベテラン"]},{"id":"Self-Management-8","category":"セルフマネジメント","categoryKey":"Self-Management","number":8,"title":"［中途入社者向け］入社時研修","summary":"本研修は、中途で入社して間もない方を対象にしています。\n「入社したはいいものの、新しい職場に馴染めない」\n「精一杯仕事をしているのに、周囲から良い印象を持ってもらえない」\n中途で入社したての方からは、よくこのようなお悩みを伺います。\n新しい職場で活躍するには、業務内容を理解することはもちろん、元の職場との違いを認識したり周囲との関係を構築したりすることも求められます。\n研修では、入社して数か月以内の時期に焦点をあて、今後職場で活躍できるようになるために取るべき行動をお伝えします。\n中途入社の方はぜひご参加ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4QdBkmlPQs3SQ5YMTSYx/","online":false,"sessions":[{"date":"2026-10-09","weekday":"金","start":"13:30","end":"15:30","part":""},{"date":"2026-11-04","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2026-12-04","weekday":"金","start":"09:00","end":"11:00","part":""},{"date":"2027-01-12","weekday":"火","start":"13:30","end":"15:30","part":""},{"date":"2027-02-08","weekday":"月","start":"13:30","end":"15:30","part":""},{"date":"2027-03-05","weekday":"金","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-10-09","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["中堅・ベテラン","若手"]},{"id":"Self-Management-9","category":"セルフマネジメント","categoryKey":"Self-Management","number":9,"title":"［若手向け］キャリアデザイン研修","summary":"企業を取り巻く環境が目まぐるしく変化する中、「将来に漠然と不安を抱えている」「毎日何となく仕事に取り組んでしまっている」など、自身のキャリアの方向性が定まらない、定められないという人もいらっしゃるのではないでしょうか。\n本研修では、若手社員を対象に、キャリアを考えるプロセスをお伝えします。ワークを通じて、自身のキャリアについて考えていただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4S5swXS41wl15u313XjK/","online":false,"sessions":[{"date":"2026-10-22","weekday":"木","start":"13:30","end":"15:30","part":""},{"date":"2026-11-18","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2027-02-22","weekday":"月","start":"13:30","end":"15:30","part":""},{"date":"2027-03-10","weekday":"水","start":"16:30","end":"18:30","part":""}],"firstDate":"2026-10-22","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手"]},{"id":"Self-Management-10","category":"セルフマネジメント","categoryKey":"Self-Management","number":10,"title":"［若手向け］成長するために必要な要素","summary":"世の中には、ビジネスパーソンとして成長するための取り組みがあふれています。その中で、何から始めるべきかお悩みの方もいらっしゃるのではないでしょうか。\n本研修では、若手社員を対象に、ビジネスパーソンとして成長するために必要な要素の全体像をお伝えします。自分自身がさらに成長するために何に注力すべきか、他社の参加者とのワークを通じて考えていきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4S73z7ZMCeEEvi9zV9c7/","online":false,"sessions":[{"date":"2026-12-03","weekday":"木","start":"10:00","end":"17:00","part":""},{"date":"2027-01-25","weekday":"月","start":"10:00","end":"17:00","part":""}],"firstDate":"2026-12-03","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手"]},{"id":"Self-Management-11","category":"セルフマネジメント","categoryKey":"Self-Management","number":11,"title":"［若手向け］仕事経験を成長につなげるコツ","summary":"社会人として継続的に成長していくためには、仕事を通じて得られる経験を学びにつなげることが不可欠です。\n本研修では、若手社員を対象に、どのような仕事を経験することが成長につながるのか、目の前の仕事から経験を得るためにできることは何か、などをお伝えします。「経験を成長につなげる」という発想を持つことで、日々の仕事から学びの機会が得られるようになります。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4Ty55b65cvP777VG3Hsq/","online":false,"sessions":[{"date":"2026-10-27","weekday":"火","start":"09:00","end":"11:00","part":""},{"date":"2026-11-19","weekday":"木","start":"16:30","end":"18:30","part":""},{"date":"2027-01-27","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2027-02-16","weekday":"火","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-10-27","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手"]},{"id":"Self-Management-12","category":"セルフマネジメント","categoryKey":"Self-Management","number":12,"title":"［若手向け］自己成長につなげるリフレクション","summary":"成長を続けるビジネスパーソンは、経験の振り返り、つまりリフレクションを行っています。しかし、ただ「リフレクション（振り返り）をしよう」と言われても、何をどのように振り返ればいいのかはなかなかわからないものです。\n本研修では、若手社員を対象に、業務の振り返りの手法であるリフレクションの定義や重要性、そしてリフレクションを行う際のポイントをお伝えします。ワークを通じて学ぶことで、今後も継続してリフレクションを行うための気づきをお持ち帰りいただきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4Um7MZPqwom6l5do6j61/","online":false,"sessions":[{"date":"2026-10-28","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2026-11-05","weekday":"木","start":"16:30","end":"18:30","part":""},{"date":"2026-11-20","weekday":"金","start":"16:30","end":"18:30","part":""},{"date":"2026-12-24","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2027-01-20","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2027-02-25","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2027-03-08","weekday":"月","start":"16:30","end":"18:30","part":""}],"firstDate":"2026-10-28","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手"]},{"id":"Self-Management-13","category":"セルフマネジメント","categoryKey":"Self-Management","number":13,"title":"［若手向け］フォロワーシップの高め方","summary":"フォロワーシップとは、組織のリーダーを支援する能力を指します。組織の成功にはフォロワーシップが不可欠です。若手社員にとって、フォロワーシップを発揮することは、自身の成長や周囲からの信頼を得るために重要です。\n本研修では、若手社員を対象に、「フォロワーシップとは何か」「フォロワーシップを高める方法」を紹介します。自身のフォロワーシップの傾向を理解する良い機会にもなりますので、ぜひご参加ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/FXEo3Y65r6BemF82mneV/","online":false,"sessions":[{"date":"2026-12-08","weekday":"火","start":"13:00","end":"15:00","part":""},{"date":"2027-03-09","weekday":"火","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-12-08","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手","新人"]},{"id":"Self-Management-14","category":"セルフマネジメント","categoryKey":"Self-Management","number":14,"title":"【公開型ライブオンライン研修】［若手向け］フォロワーシップの高め方","summary":"フォロワーシップとは、組織のリーダーを支援する能力を指します。組織の成功にはフォロワーシップが不可欠です。若手社員にとって、フォロワーシップを発揮することは、自身の成長や周囲からの信頼を得るために重要です。\n本研修では、若手社員を対象に、「フォロワーシップとは何か」「フォロワーシップを高める方法」を紹介します。自身のフォロワーシップの傾向を理解する良い機会にもなりますので、ぜひご参加ください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/FXEo3Y65r6BemF82mneV/","online":true,"sessions":[{"date":"2026-11-09","weekday":"月","start":"10:00","end":"12:00","part":""},{"date":"2027-01-28","weekday":"木","start":"10:00","end":"12:00","part":""}],"firstDate":"2026-11-09","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手","新人"]},{"id":"Self-Management-15","category":"セルフマネジメント","categoryKey":"Self-Management","number":15,"title":"［若手向け］自身の成長を促す自己理解の深め方","summary":"仕事で成果を上げるためには、能力やスキルを発揮するだけでなく、自分自身の特性をうまく活かすことも必要です。考え方や行動特性、感情、仕事に対する意欲など、能力やスキル以外の部分が仕事の成果に大きな影響を与えることを実感している人も多いでしょう。\n本研修では、若手社員を対象に、自身の特性を正しく把握するための「自己理解」を深める方法について、自身の行動を振り返りながら考えていきます。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4Yl7dPd2de4b2iGD7bkd/","online":false,"sessions":[{"date":"2026-10-21","weekday":"水","start":"16:30","end":"18:30","part":""},{"date":"2026-11-17","weekday":"火","start":"09:00","end":"11:00","part":""},{"date":"2026-12-21","weekday":"月","start":"09:00","end":"11:00","part":""},{"date":"2027-01-21","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2027-02-16","weekday":"火","start":"13:30","end":"15:30","part":""},{"date":"2027-03-23","weekday":"火","start":"16:30","end":"18:30","part":""}],"firstDate":"2026-10-21","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手"]},{"id":"Self-Management-16","category":"セルフマネジメント","categoryKey":"Self-Management","number":16,"title":"［若手向け］成長を促進するための知識の拡げ方","summary":"社会人として早い段階でいかに多くの知識を得るかが、その後の成長に大きく関わってきます。知識が増えるほど成長の必要性を感じる機会が増え、より成長を加速させていくからです。\n本研修は、若手のうちにどのように知識を増やしていくか、そのポイントをお伝えする研修です。得られる知識の質と量を高めるための読書方法もご紹介します。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4ZpxZ9q29nrcGxcVvS95/","online":false,"sessions":[{"date":"2026-10-23","weekday":"金","start":"09:00","end":"11:00","part":""},{"date":"2026-12-02","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2027-01-15","weekday":"金","start":"13:30","end":"15:30","part":""},{"date":"2027-03-10","weekday":"水","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-10-23","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手"]},{"id":"Self-Management-17","category":"セルフマネジメント","categoryKey":"Self-Management","number":17,"title":"［若手向け］仕事への向き合い方","summary":"同じ仕事であっても、その仕事をどう捉えるかは人によって異なり、また、仕事にどう向き合うかによって、中長期的に自分がどう成長できるかが変わってきます。\n本研修は、若手社員を対象に、日々の仕事をどのように捉え、どう取り組むべきかを考えていく研修です。任された仕事への意義を見いだし、今後の成長の幅を広げるきっかけにしてください。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4dOduv2IVK3IIh8z7iJn/","online":false,"sessions":[{"date":"2026-10-09","weekday":"金","start":"09:00","end":"11:00","part":""},{"date":"2026-11-12","weekday":"木","start":"09:00","end":"11:00","part":""},{"date":"2027-01-22","weekday":"金","start":"09:00","end":"11:00","part":""},{"date":"2027-02-08","weekday":"月","start":"09:00","end":"11:00","part":""},{"date":"2027-03-18","weekday":"木","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-10-09","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手"]},{"id":"Self-Management-18","category":"セルフマネジメント","categoryKey":"Self-Management","number":18,"title":"［若手向け］仕事に対するセルフマインド醸成","summary":"人間は、体調や周りの環境、人間関係などで、どうしてもやる気（マインド）が上下してしまうものです。しかし、そのやる気の上下に身を任せたままにしてしまうと、仕事のパフォーマンスは安定せず、うまく仕事を進めることができません。\n本研修では、若手社員を対象に、仕事のパフォーマンスを一定の水準で維持するための、セルフマインド（仕事に対するやる気）のコントロール法について学んでいただきます。セルフマインドは何から生じるのか、セルフマインドをコントロールするにはどのような点を意識するとよいのかなどを、心理学の理論を用いてお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4ddo2Id94P36XOG5Fd4Z/","online":false,"sessions":[{"date":"2026-12-03","weekday":"木","start":"13:30","end":"15:30","part":""},{"date":"2027-03-08","weekday":"月","start":"09:00","end":"11:00","part":""}],"firstDate":"2026-12-03","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手"]},{"id":"Self-Management-19","category":"セルフマネジメント","categoryKey":"Self-Management","number":19,"title":"自己成長のための習慣化","summary":"これまでの人生の中で、「○○を習慣にしたい」と取り組んだことがある方は大勢いらっしゃるかと思います。その習慣化しようとしたものの中には、習慣になったもの・ならなかったもの、それぞれあるのではないでしょうか。\n本研修では、若手社員を対象に、自己成長につなげるための具体的な習慣化の手順をお伝えします。また、習慣化のメリットや、習慣化がなかなかできない理由とその乗り越え方もご紹介します。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4eqt9w95w13ySpZQ4B4q/","online":false,"sessions":[{"date":"2026-10-21","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2026-11-09","weekday":"月","start":"09:00","end":"11:00","part":""},{"date":"2026-11-24","weekday":"火","start":"09:00","end":"11:00","part":""},{"date":"2026-12-02","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-01-26","weekday":"火","start":"13:30","end":"15:30","part":""},{"date":"2027-02-10","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2027-03-05","weekday":"金","start":"16:30","end":"18:30","part":""}],"firstDate":"2026-10-21","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手"]},{"id":"Self-Management-20","category":"セルフマネジメント","categoryKey":"Self-Management","number":20,"title":"2年目社員としての立ち居振る舞い","summary":"本研修は、新卒2年目の方を対象にしています。\n新卒1年目の頃と新卒2年目以降とでは周囲からの見られ方が大きく変わり、それに伴い求められる行動も1年目の頃とは大きく異なります。\n研修では、新卒1年目と新卒2年目の違いに焦点を当て、2年目以降も職場で活躍するために必要な心構えや行動をお伝えします。","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4f23BpYcFXcbesc91n71/","online":false,"sessions":[{"date":"2026-12-21","weekday":"月","start":"13:00","end":"15:00","part":""},{"date":"2027-01-14","weekday":"木","start":"09:30","end":"11:30","part":""},{"date":"2027-02-12","weekday":"金","start":"09:30","end":"11:30","part":""},{"date":"2027-03-23","weekday":"火","start":"13:00","end":"15:00","part":""}],"firstDate":"2026-12-21","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["若手","新人"]},{"id":"Self-Management-21","category":"セルフマネジメント","categoryKey":"Self-Management","number":21,"title":"新入社員フォローアップ研修","summary":"社会人生活を充実させるためには、教わったことをそのままにせず、実践を通じて定着させることが極めて重要です。入社して半年から1年、無我夢中で走ってきた新入社員の皆さんは、入社時の研修で学んだことをどれだけ実践できていますか。\n本研修では、「新入社員研修で学んだ内容が実践できているか」を振り返るとともに、「社会人2年目の社員に求められていること」をお伝えします。また、社会人2年目に向けて、今後の実行計画を作成していただきます。\n*9月から3月までの期間限定開講です\n*新入社員研修（4月開催）にご参加いただいた方が対象です","url":"https://learning-navigator.all-different.co.jp/app/gate/trn/detail/4f74Ov3HBe51nu77891m/","online":false,"sessions":[{"date":"2026-10-13","weekday":"火","start":"13:30","end":"15:30","part":""},{"date":"2026-10-27","weekday":"火","start":"13:30","end":"15:30","part":""},{"date":"2026-11-20","weekday":"金","start":"09:00","end":"11:00","part":""},{"date":"2026-12-16","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2027-01-20","weekday":"水","start":"13:30","end":"15:30","part":""},{"date":"2027-02-17","weekday":"水","start":"09:00","end":"11:00","part":""},{"date":"2027-03-08","weekday":"月","start":"13:30","end":"15:30","part":""},{"date":"2027-03-23","weekday":"火","start":"13:30","end":"15:30","part":""}],"firstDate":"2026-10-13","relatedThemeKey":"Self-Management","relatedTheme":"セルフマネジメント","targets":["新人"]}]};

    const { metadata, courses } = window.TRAINING_DATA;
    const allSessions = courses.flatMap(course => course.sessions.map(session => ({ ...session, course })));
    const elements = {
      search: document.querySelector('#search'),
      category: document.querySelector('#category'),
      target: document.querySelector('#target'),
      month: document.querySelector('#month'),
      format: document.querySelector('#format'),
      sort: document.querySelector('#sort'),
      sortWrap: document.querySelector('#sortWrap'),
      grid: document.querySelector('#courseGrid'),
      timeline: document.querySelector('#timeline'),
      count: document.querySelector('#resultCount'),
      clear: document.querySelector('#clearFilters'),
      backTop: document.querySelector('#backTop'),
    };
    let currentView = 'courses';

    const dateFormatter = new Intl.DateTimeFormat('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' });
    const monthFormatter = new Intl.DateTimeFormat('ja-JP', { year: 'numeric', month: 'long' });
    const collator = new Intl.Collator('ja');

    function localDate(iso) {
      const [year, month, day] = iso.split('-').map(Number);
      return new Date(year, month - 1, day);
    }
    function normalize(value) {
      return String(value || '').normalize('NFKC').toLocaleLowerCase('ja');
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
    }
    function formatSession(session) {
      return dateFormatter.format(localDate(session.date));
    }
    function filteredSessions(course) {
      const selectedMonth = elements.month.value;
      return selectedMonth ? course.sessions.filter(session => session.date.startsWith(selectedMonth)) : course.sessions;
    }
    function matches(course) {
      const query = normalize(elements.search.value.trim());
      const category = elements.category.value;
      const target = elements.target.value;
      const format = elements.format.value;
      if (category && course.relatedTheme !== category) return false;
      if (target && !course.targets.includes(target)) return false;
      if (format === 'online' && !course.online) return false;
      if (format === 'venue' && course.online) return false;
      if (elements.month.value && filteredSessions(course).length === 0) return false;
      if (query && !normalize(`${course.title} ${course.summary} ${course.relatedTheme} ${course.relatedThemeKey} ${course.targets.join(' ')}`).includes(query)) return false;
      return true;
    }
    function sessionMarkup(session) {
      return `<div class="session-chip"><strong>${escapeHtml(formatSession(session))}</strong><time>${escapeHtml(session.start)}–${escapeHtml(session.end)}</time>${session.part ? `<span class="part">${escapeHtml(session.part)}</span>` : ''}</div>`;
    }
    function courseMarkup(course) {
      const sessions = filteredSessions(course);
      const visible = sessions.slice(0, 3);
      return `<article class="course-card">
        <div class="badges">
          <span class="badge">関連テーマ · ${escapeHtml(course.relatedTheme)}</span>
          ${course.online ? '<span class="badge online">LIVEオンライン</span>' : '<span class="badge">東京会場</span>'}
        </div>
        <h3>${escapeHtml(course.title)}</h3>
        <div class="audience"><span class="audience-label">対象</span>${course.targets.map(target => `<span class="audience-item">${escapeHtml(target)}</span>`).join('')}</div>
        <div class="course-meta"><strong>開催日程</strong><span>${sessions.length}件</span></div>
        <div class="session-chips">${visible.map(sessionMarkup).join('')}</div>
        ${sessions.length > visible.length ? `<p class="more-sessions">ほか ${sessions.length - visible.length} 日程</p>` : ''}
        <details>
          <summary>概要と全日程を見る</summary>
          <div class="detail-body">
            <div class="detail-copy">${escapeHtml(course.summary)}</div>
            <div class="all-sessions">${sessions.map(session => `<div class="all-session">${escapeHtml(formatSession(session))}　${escapeHtml(session.start)}–${escapeHtml(session.end)}${session.part ? `　<span class="part">${escapeHtml(session.part)}</span>` : ''}</div>`).join('')}</div>
            ${course.url ? `<a class="detail-link" href="${escapeHtml(course.url)}" target="_blank" rel="noopener noreferrer">研修の詳細・申込ページへ <span aria-hidden="true">↗</span></a>` : ''}
          </div>
        </details>
      </article>`;
    }
    function renderCourses() {
      const visible = courses.filter(matches);
      const sort = elements.sort.value;
      visible.sort((a, b) => {
        if (sort === 'title') return collator.compare(a.title, b.title);
        if (sort === 'sessions') return filteredSessions(b).length - filteredSessions(a).length || a.firstDate.localeCompare(b.firstDate);
        const aDate = filteredSessions(a)[0]?.date || '9999-12-31';
        const bDate = filteredSessions(b)[0]?.date || '9999-12-31';
        return aDate.localeCompare(bDate) || collator.compare(a.title, b.title);
      });
      elements.grid.innerHTML = visible.length ? visible.map(courseMarkup).join('') : emptyMarkup();
      elements.count.textContent = `${visible.length.toLocaleString('ja-JP')}件の研修が見つかりました`;
    }
    function timelineItemMarkup(item) {
      const date = localDate(item.date);
      return `<article class="timeline-item">
        <div class="date-box"><strong>${date.getDate()}</strong><span>${date.toLocaleDateString('ja-JP', { month: 'short', weekday: 'short' })}</span></div>
        <div class="timeline-title"><a href="${escapeHtml(item.course.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.course.title)}</a><small>関連テーマ: ${escapeHtml(item.course.relatedTheme)} ／ 対象: ${escapeHtml(item.course.targets.join('・'))} ／ ${item.course.online ? 'ライブオンライン' : '東京会場'}${item.part ? ` ／ ${escapeHtml(item.part)}` : ''}</small></div>
        <div class="timeline-time">${escapeHtml(item.start)}–${escapeHtml(item.end)}</div>
      </article>`;
    }
    function renderTimeline() {
      const visible = allSessions.filter(item => matches(item.course) && (!elements.month.value || item.date.startsWith(elements.month.value)));
      visible.sort((a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start) || collator.compare(a.course.title, b.course.title));
      let previousMonth = '';
      const output = [];
      for (const item of visible) {
        const month = item.date.slice(0, 7);
        if (month !== previousMonth) {
          output.push(`<div class="month-heading">${escapeHtml(monthFormatter.format(localDate(`${month}-01`)))}</div>`);
          previousMonth = month;
        }
        output.push(timelineItemMarkup(item));
      }
      elements.timeline.innerHTML = output.length ? output.join('') : emptyMarkup();
      elements.count.textContent = `${visible.length.toLocaleString('ja-JP')}件の日程が見つかりました`;
    }
    function emptyMarkup() {
      return '<div class="empty"><strong>該当する研修がありません</strong>キーワードを短くするか、絞り込み条件を変更してください。</div>';
    }
    function render() {
      if (currentView === 'courses') renderCourses(); else renderTimeline();
    }
    function setView(view) {
      currentView = view;
      document.querySelectorAll('.view-button').forEach(button => button.classList.toggle('active', button.dataset.view === view));
      elements.grid.classList.toggle('hidden', view !== 'courses');
      elements.timeline.classList.toggle('hidden', view !== 'timeline');
      elements.sortWrap.classList.toggle('hidden', view !== 'courses');
      render();
    }

    const categories = [...new Set(courses.map(course => course.relatedTheme))];
    for (const category of categories) elements.category.add(new Option(category, category));
    const targetOrder = ['経営層', '管理職', '中堅・ベテラン', '若手', '新人'];
    const targets = [...new Set(courses.flatMap(course => course.targets))].sort((a, b) => targetOrder.indexOf(a) - targetOrder.indexOf(b));
    for (const target of targets) elements.target.add(new Option(target, target));
    const months = [...new Set(allSessions.map(session => session.date.slice(0, 7)))].sort();
    for (const month of months) elements.month.add(new Option(monthFormatter.format(localDate(`${month}-01`)), month));
    document.querySelector('#sourceFile').textContent = metadata.sourceFile;

    [elements.search, elements.category, elements.target, elements.month, elements.format, elements.sort].forEach(element => element.addEventListener(element.tagName === 'INPUT' ? 'input' : 'change', render));
    document.querySelectorAll('.view-button').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));
    elements.clear.addEventListener('click', () => {
      elements.search.value = '';
      elements.category.value = '';
      elements.target.value = '';
      elements.month.value = '';
      elements.format.value = '';
      elements.sort.value = 'date';
      render();
      elements.search.focus();
    });
    elements.backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('scroll', () => elements.backTop.classList.toggle('show', window.scrollY > 700), { passive: true });
    setView('courses');
  </script>
</body>
</html>
